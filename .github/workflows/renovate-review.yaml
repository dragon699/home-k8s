name: renovate-review
run-name: "Review of ${{ github.event.pull_request.title || format('PR #{0}', inputs.pr) }}"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: renovate-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:

  Review:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: gha-runner-home-k8s
    timeout-minutes: 30

    steps:
    - name: Fetch code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Request review
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number || inputs.pr }}
        TITLE: ${{ github.event.pull_request.title }}
        BODY: ${{ github.event.pull_request.body }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        BRANCH: ${{ github.head_ref }}
      run: |
        set -euo pipefail

        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          PR_JSON="$(curl -sS --fail-with-body -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          if [[ "$(jq -r '.head.repo.full_name' <<< "$PR_JSON")" != "${REPO}" ]] || [[ "$(jq -r '.head.ref' <<< "$PR_JSON")" != renovate/* ]]; then
            echo "PR #${PR} is not a Renovate PR from this repository"
            exit 1
          fi
          TITLE="$(jq -r '.title' <<< "$PR_JSON")"
          BODY="$(jq -r '.body // ""' <<< "$PR_JSON")"
          BASE="$(jq -r '.base.sha' <<< "$PR_JSON")"
          HEAD="$(jq -r '.head.sha' <<< "$PR_JSON")"
          BRANCH="$(jq -r '.head.ref' <<< "$PR_JSON")"
          git fetch -q origin "${HEAD}"
        fi

        TABLE_HASH="$(printf '%s' "$BODY" | grep -E '^\| ' | sha256sum | cut -c1-12)"
        MARKER="<!-- renovate-review:${TABLE_HASH} -->"
        API="https://api.github.com/repos/${REPO}/issues"
        gh_api() { curl -sS --fail-with-body -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
        COMMENTS="$(gh_api "${API}/${PR}/comments?per_page=100")"
        EXISTING="$(jq -r '[.[] | select(.body | startswith("<!-- renovate-review"))][0].id // empty' <<< "$COMMENTS")"
        if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]] && jq -e --arg m "$MARKER" 'any(.[]; .body | startswith($m))' <<< "$COMMENTS" >/dev/null; then
          echo "These versions were already reviewed; skipping"
          exit 0
        fi

        APP="${BRANCH#renovate/}"
        APP="${APP%-major}"
        DIFF="$(git diff "$BASE" "$HEAD" | head -c 20000)"
        VALUES=""
        for FILE in $(git ls-tree -r --name-only "$HEAD" -- helm | grep -E "^helm/[^/]+/${APP}/[^/]+\.ya?ml$" || true); do
          VALUES+="--- ${FILE}"$'\n'"$(git show "${HEAD}:${FILE}" | head -c 15000)"$'\n'
        done

        PROMPT="$(printf 'Review this Renovate pull request for dragon699/home-k8s.\n\nTitle: %s\nApp: %s\n\n## Renovate description (update table and release notes)\n%s\n\n## Diff\n```diff\n%s\n```\n\n## Current values files of the app\n```yaml\n%s\n```\n' \
          "$TITLE" "$APP" "$(printf '%s' "$BODY" | head -c 24000)" "$DIFF" "${VALUES:-none}")"

        REQUEST="$(jq -n --arg prompt "$PROMPT" --arg user "renovate-pr-${PR}-${GITHUB_RUN_ID}" \
          '{model: "openclaw/renovate-reviewer", stream: false, user: $user, messages: [{role: "user", content: $prompt}]}')"

        REVIEW="$(curl -sS --fail-with-body -m 1500 \
          -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" -H "Content-Type: application/json" \
          "${OPENCLAW_URL}/v1/chat/completions" -d "$REQUEST" | jq -r '.choices[0].message.content // empty')"

        if [[ -z "$REVIEW" ]]; then
          echo "The agent returned no review"
          exit 1
        fi

        COMMENT="$(jq -n --arg body "${MARKER}"$'\n'"${REVIEW}"$'\n\n'"<sub>Reviewed ${HEAD:0:7} on $(TZ=Europe/Sofia date +'%d/%m at %H:%M')</sub>" '{body: $body}')"
        if [[ -n "$EXISTING" ]]; then
          gh_api -X PATCH "${API}/comments/${EXISTING}" -d "$COMMENT" >/dev/null
          echo "Updated review comment ${EXISTING}"
        else
          gh_api -X POST "${API}/${PR}/comments" -d "$COMMENT" >/dev/null
          echo "Posted review comment"
        fi
