name: renovate-review
run-name: "Review of ${{ github.event.pull_request.title || format('PR #{0}', inputs.pr) }}"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: renovate-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:

  Review:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: gha-runner-home-k8s
    timeout-minutes: 30

    steps:
    - name: Fetch code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Request review
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number || inputs.pr }}
        TITLE: ${{ github.event.pull_request.title }}
        BODY: ${{ github.event.pull_request.body }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        BRANCH: ${{ github.head_ref }}
      run: |
        set -euo pipefail

        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          PR_JSON="$(curl -sS --fail-with-body -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          if [[ "$(jq -r '.head.repo.full_name' <<< "$PR_JSON")" != "${REPO}" ]] || [[ "$(jq -r '.head.ref' <<< "$PR_JSON")" != renovate/* ]]; then
            echo "PR #${PR} is not a Renovate PR from this repository"
            exit 1
          fi
          TITLE="$(jq -r '.title' <<< "$PR_JSON")"
          BODY="$(jq -r '.body // ""' <<< "$PR_JSON")"
          BASE="$(jq -r '.base.sha' <<< "$PR_JSON")"
          HEAD="$(jq -r '.head.sha' <<< "$PR_JSON")"
          BRANCH="$(jq -r '.head.ref' <<< "$PR_JSON")"
          git fetch -q origin "${HEAD}"
        fi

        TABLE_HASH="$(printf '%s' "$BODY" | grep -E '^\| ' | sha256sum | cut -c1-12)"
        MARKER="<!-- renovate-review:${TABLE_HASH} -->"
        API="https://api.github.com/repos/${REPO}/issues"
        gh_api() { curl -sS --fail-with-body -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }
        COMMENTS="$(gh_api "${API}/${PR}/comments?per_page=100")"
        EXISTING="$(jq -r '[.[] | select(.body | startswith("<!-- renovate-review"))][0].id // empty' <<< "$COMMENTS")"
        if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]] && jq -e --arg m "$MARKER" 'any(.[]; .body | startswith($m))' <<< "$COMMENTS" >/dev/null; then
          echo "These versions were already reviewed; skipping"
          exit 0
        fi

        APP="${BRANCH#renovate/}"
        APP="${APP%-major}"
        APP="${APP%-digest}"
        DIFF="$(git diff "$BASE" "$HEAD" | head -c 20000)"
        VALUES=""
        for FILE in $(git ls-tree -r --name-only "$HEAD" -- helm | grep -E "^helm/[^/]+/${APP}/[^/]+\.ya?ml$" || true); do
          VALUES+="--- ${FILE}"$'\n'"$(git show "${HEAD}:${FILE}" | head -c 15000)"$'\n'
        done

        RENDER_DIR="$(mktemp -d -p "${RUNNER_TEMP}")"
        RENDER="$(RENDER_DIR="$RENDER_DIR" bash .github/scripts/chart-diff.sh "$BASE" "$HEAD" "$APP" 2>/dev/null | head -c 30000 || true)"
        CHECKS="$(bash .github/scripts/app-checks.sh "$BASE" "$HEAD" "$APP" "$RENDER_DIR" 2>/dev/null | head -c 8000 || true)"
        FAILURES="$(printf '%s\n%s\n' "$RENDER" "$CHECKS" | grep '^CHECK FAILED: ' | sed 's/^CHECK FAILED: //' | sort -u || true)"

        CONFIGS=""
        for FILE in $(git ls-tree -r --name-only "$HEAD" -- config | grep -E "^config/([^/]+/)?${APP}/" || true); do
          CONFIGS+="--- ${FILE}"$'\n'"$(git show "${HEAD}:${FILE}" | head -c 8000)"$'\n'
        done
        CALLERS="$(git grep -n -I -i -w -C 5 -e "${APP}" "$HEAD" -- config helm manifests ":(exclude)manifests/*/${APP}/*" ":(exclude)helm/*/${APP}/*" ":(exclude)config/${APP}/*" ":(exclude)config/*/${APP}/*" | sed "s#^${HEAD}:##" | head -c 10000 || true)"

        PROMPT="$(printf 'Review this Renovate pull request for dragon699/home-k8s.\n\nToday is %s.\nTitle: %s\nApp: %s\n\n## Automated checks (ground truth: registry lookups, the app'"'"'s own validator run on the new image, CRD schema validation)\n%s\n\nFailed checks:\n%s\n\n## Renovate description (update table and release notes)\n%s\n\n## Diff\n```diff\n%s\n```\n\n## Rendered chart changes (helm template of the old and new chart with this repo'"'"'s values)\n%s\n\n## Current values files of the app\n```yaml\n%s\n```\n\n## App config files in this repo (config/)\n```\n%s\n```\n\n## Other repo files that call this app\n```\n%s\n```\n' \
          "$(date -u +%Y-%m-%d)" "$TITLE" "$APP" "${CHECKS:-none}" "${FAILURES:-none}" "$(printf '%s' "$BODY" | head -c 24000)" "$DIFF" "${RENDER:-No chart in this pull request.}" "${VALUES:-none}" "${CONFIGS:-none}" "${CALLERS:-none}")"

        review() {
          local request
          request="$(jq -n --arg model "openclaw/$1" --arg prompt "$2" --arg user "renovate-pr-${PR}-${GITHUB_RUN_ID}-$1" \
            '{model: $model, stream: false, user: $user, messages: [{role: "user", content: $prompt}]}')"
          curl -sS --fail-with-body -m 1500 --retry 5 --retry-delay 60 \
            -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" -H "Content-Type: application/json" \
            "${OPENCLAW_URL}/v1/chat/completions" -d "$request" | jq -r '.choices[0].message.content // empty'
        }

        REVIEW="$(review renovate-reviewer "$PROMPT")"
        if [[ -z "$REVIEW" ]]; then
          echo "The agent returned no review"
          exit 1
        fi

        FOOTER=""
        if [[ "$REVIEW" != ✅* ]]; then
          echo "First pass did not approve, requesting a second opinion"
          SECOND="$(review renovate-reviewer-deep "${PROMPT}"$'\n\n## First-pass review (verify its claims, do not trust them)\n'"${REVIEW}" || true)"
          if [[ -n "$SECOND" ]]; then
            REVIEW="$SECOND"
            FOOTER=" · second opinion"
          fi
        fi

        if [[ -n "$FAILURES" ]]; then
          if [[ "$REVIEW" != ⛔* ]]; then
            REVIEW="⛔ Hold — automated checks failed"$'\n'"$(tail -n +2 <<< "$REVIEW")"
          fi
          REVIEW+=$'\n\n'"### Automated check failures"$'\n'"$(sed 's/^/- /' <<< "$FAILURES")"
        fi

        COMMENT="$(jq -n --arg body "${MARKER}"$'\n'"${REVIEW}"$'\n\n'"<sub>Reviewed ${HEAD:0:7} on $(TZ=Europe/Sofia date +'%d/%m at %H:%M')${FOOTER}</sub>" '{body: $body}')"
        if [[ -n "$EXISTING" ]]; then
          gh_api -X PATCH "${API}/comments/${EXISTING}" -d "$COMMENT" >/dev/null
          echo "Updated review comment ${EXISTING}"
        else
          gh_api -X POST "${API}/${PR}/comments" -d "$COMMENT" >/dev/null
          echo "Posted review comment"
        fi

        if [[ -n "$FAILURES" ]]; then
          echo "::error::Automated checks failed"
          printf '%s\n' "$FAILURES"
          exit 1
        fi
