name: argocd
run-name: Reconcile cluster

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - '.github/workflows/argocd.yaml'
    - '.github/scripts/argocd-sync.sh'
    - 'argocd/**'
    - 'config/**'
    - 'helm/**'
    - 'manifests/**'

permissions:
  contents: read


jobs:

  Inspect:
    runs-on: gha-runner-home-k8s
    outputs:
      prerequisites: ${{ steps.items_to_sync.outputs.prerequisites }}
      apps: ${{ steps.items_to_sync.outputs.apps }}
    
    steps:
    - name: Fetch code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Prepare sync items
      id: items_to_sync
      run: |
        set -euo pipefail

        trim() {
          local value="$1"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          printf '%s' "$value"
        }

        BASE_SHA="${{ github.event.before }}"
        PREREQUISITES=()
        ITEMS_TO_SYNC=()

        if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
          if git rev-parse --verify "${{ github.sha }}^" >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse --verify "${{ github.sha }}^")"
          else
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
        fi

        CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")"

        if grep -qE "^argocd/apps/" <<< "$CHANGED_FILES"; then
          PREREQUISITES+=("argocd-apps")
        fi

        if grep -qE "^config/" <<< "$CHANGED_FILES"; then
          PREREQUISITES+=("config-generator")
        fi

        app_entries() {
          git show "$1:$2" 2>/dev/null | awk '/^  - name: /{name=$3; next} /^  [^ -]/{name=""} name!=""{print name "\t" $0}'
        }

        for FILE in $(grep -E "^argocd/apps/.+\.ya?ml$" <<< "$CHANGED_FILES" || true); do
          CHANGED_APPS="$(diff <(app_entries "$BASE_SHA" "$FILE") <(app_entries "${{ github.sha }}" "$FILE") | sed -nE 's/^[<>] ([^\t]+)\t.*/\1/p' | sort -u || true)"
          CURRENT_APPS="$(app_entries "${{ github.sha }}" "$FILE" | cut -f1 | sort -u)"
          while read -r APP; do
            [[ -n "$APP" ]] && ITEMS_TO_SYNC+=("$APP")
          done < <(comm -12 <(printf '%s\n' "$CHANGED_APPS") <(printf '%s\n' "$CURRENT_APPS"))
        done

        for DIR in helm manifests; do
          for PROJECT in apps infra monitoring; do
            PROJECT_APPS=$(ls "${DIR}/${PROJECT}" 2>/dev/null || true)

            for APP in $PROJECT_APPS; do
              if grep -qE "^${DIR}/${PROJECT}/${APP}/" <<< "$CHANGED_FILES"; then
                ITEMS_TO_SYNC+=("${APP}")
              fi
            done
          done
        done

        to_matrix() {
          printf '%s\n' "$@" | sed '/^$/d' | sort -u | jq -R '{name: .}' | jq -sc '{include: .}'
        }

        printf 'prerequisites=%s\n' "$(to_matrix "${PREREQUISITES[@]}")" >> "$GITHUB_OUTPUT"
        printf 'apps=%s\n' "$(to_matrix "${ITEMS_TO_SYNC[@]}")" >> "$GITHUB_OUTPUT"

  Prerequisites:
    name: Sync ${{ matrix.name || ' ' }}
    needs: Inspect
    runs-on: gha-runner-home-k8s
    if: ${{ needs.Inspect.outputs.prerequisites != '{"include":[]}' }}
    strategy:
      matrix: ${{ fromJson(needs.Inspect.outputs.prerequisites) }}
      fail-fast: false
    timeout-minutes: 10

    steps:
    - name: Fetch code
      uses: actions/checkout@v7

    - name: Sync in ArgoCD
      run: bash .github/scripts/argocd-sync.sh "${{ matrix.name }}"

  Sync:
    name: Sync ${{ matrix.name || ' ' }}
    needs: [Inspect, Prerequisites]
    runs-on: gha-runner-home-k8s
    if: ${{ always() && needs.Inspect.result == 'success' && needs.Prerequisites.result != 'failure' && needs.Inspect.outputs.apps != '{"include":[]}' }}
    strategy:
      matrix: ${{ fromJson(needs.Inspect.outputs.apps) }}
      fail-fast: false
    timeout-minutes: 10

    steps:
    - name: Fetch code
      uses: actions/checkout@v7

    - name: Sync in ArgoCD
      run: bash .github/scripts/argocd-sync.sh "${{ matrix.name }}"
