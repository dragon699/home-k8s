name: argocd
run-name: Reconcile cluster

on:
  workflow_dispatch:
  push:
    paths:
    - '.github/workflows/argocd.yaml'
    - 'argocd/**'
    - 'config/**'
    - 'helm/**'
    - 'manifests/**'

permissions:
  contents: read


jobs:

  Inspect:
    runs-on: gha-runner-home-k8s
    outputs:
      items: ${{ steps.items_to_sync.outputs.items }}
    
    steps:
    - name: Fetch code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Prepare sync items
      id: items_to_sync
      run: |
        set -euo pipefail

        trim() {
          local value="$1"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          printf '%s' "$value"
        }

        BASE_SHA="${{ github.event.before }}"
        ITEMS_TO_SYNC=()

        if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
          if git rev-parse --verify "${{ github.sha }}^" >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse --verify "${{ github.sha }}^")"
          else
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
        fi

        CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")"

        if grep -qE "^argocd/apps/" <<< "$CHANGED_FILES"; then
          ITEMS_TO_SYNC+=("argocd-apps")
        fi

        if grep -qE "^config/" <<< "$CHANGED_FILES"; then
          ITEMS_TO_SYNC+=("config-generator")
        fi

        for DIR in helm manifests; do
          for PROJECT in apps infra monitoring; do
            PROJECT_APPS=$(ls "${DIR}/${PROJECT}" 2>/dev/null || true)

            for APP in $PROJECT_APPS; do
              if grep -qE "^${DIR}/${PROJECT}/${APP}/" <<< "$CHANGED_FILES"; then
                ITEMS_TO_SYNC+=("${APP}")
              fi
            done
          done
        done

        mapfile -t ITEMS_TO_SYNC < <(printf '%s\n' "${ITEMS_TO_SYNC[@]}" | sed '/^$/d' | sort -u)

        ITEMS_JSON=""
        for NAME in "${ITEMS_TO_SYNC[@]}"; do
          [[ -n "$ITEMS_JSON" ]] && ITEMS_JSON+=","
          ITEMS_JSON+="{\"name\":\"${NAME}\"}"
        done

        printf 'items={"include":[%s]}\n' "$ITEMS_JSON" >> "$GITHUB_OUTPUT"

  Sync:
    name: Sync ${{ matrix.name || ' ' }}
    needs: Inspect
    runs-on: gha-runner-home-k8s
    if: ${{ needs.Inspect.outputs.items != '{"include":[]}' }}
    strategy:
      matrix: ${{ fromJson(needs.Inspect.outputs.items) }}
      fail-fast: false
    timeout-minutes: 10

    steps:
    - name: Sync in ArgoCD
      env:
        APP: ${{ matrix.name }}
      run: |
        set -euo pipefail

        SA=/var/run/secrets/kubernetes.io/serviceaccount
        URL="https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/${APP}"
        kube() { curl -sS --fail-with-body --cacert "$SA/ca.crt" -H "Authorization: Bearer $(cat "$SA/token")" "$@"; }

        # Wait for a running operation (e.g. an auto-sync) to finish first
        for i in $(seq 1 60); do
          [ "$(kube "$URL" | jq -r '.operation != null')" = "false" ] && break
          echo "Waiting for the current operation on ${APP} to finish..."
          sleep 5
        done

        STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        kube -X PATCH -H "Content-Type: application/merge-patch+json" "$URL" -d '{
          "operation": {
            "initiatedBy": {"username": "github-actions"},
            "sync": {"prune": false},
            "retry": {"limit": 15, "backoff": {"duration": "10s", "factor": 1, "maxDuration": "10s"}}
          }
        }' >/dev/null
        echo "Sync of ${APP} requested at ${STARTED}"

        for i in $(seq 1 100); do
          read -r STARTED_AT PHASE < <(kube "$URL" | jq -r '[.status.operationState.startedAt // "", .status.operationState.phase // ""] | @tsv')
          if [[ ! "$STARTED_AT" < "$STARTED" ]] && [[ "$PHASE" =~ ^(Succeeded|Failed|Error)$ ]]; then
            kube "$URL" | jq -r '"\(.status.operationState.phase): \(.status.operationState.message)",
              "sync: \(.status.sync.status), health: \(.status.health.status)"'
            [ "$PHASE" = "Succeeded" ] && exit 0 || exit 1
          fi
          sleep 5
        done
        echo "Timed out waiting for the sync of ${APP}"
        exit 1
