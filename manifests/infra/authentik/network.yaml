---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik
  namespace: authentik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
  labels:
    app: authentik
    env: home
spec:
  tls:
  - hosts:
    - auth.k8s.iaminyourpc.xyz
    secretName: tls-auth-k8s-iaminyourpc-xyz
  rules:
  - host: auth.k8s.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: authentik-server
            port:
              number: 80
