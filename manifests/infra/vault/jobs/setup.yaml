---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-setup
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
      - name: script-vault-setup
        configMap:
          name: script-vault-setup
          defaultMode: 0755
      - name: policies
        projected:
          sources:
          - configMap:
              name: data-vault-policy-external-secrets
          - configMap:
              name: data-vault-policy-admin
      containers:
      - name: setup
        image: hashicorp/vault:2.2.0
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: script-vault-setup
          mountPath: /scripts
        - name: policies
          mountPath: /policies
        command: ["/bin/sh", "/scripts/setup.sh"]
        env:
        - name: VAULT_SCHEME
          value: "http"
        - name: VAULT_ADDRESS
          valueFrom:
            secretKeyRef:
              name: data-vault-sensitive
              key: VAULT_ADDRESS
        - name: VAULT_ROOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: data-vault-sensitive
              key: VAULT_ROOT_TOKEN
        - name: VAULT_USER_EXTERNAL_SECRETS_NAME
          value: "external-secrets"
        - name: VAULT_USER_EXTERNAL_SECRETS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-vault-sensitive
              key: VAULT_USER_EXTERNAL_SECRETS_PASSWORD
        - name: VAULT_POLICY_EXTERNAL_SECRETS_NAME
          value: "external-secrets"
        - name: VAULT_POLICY_EXTERNAL_SECRETS_FILE
          value: "/policies/external-secrets.hcl"
        - name: VAULT_KV_NAME
          value: "home"
        - name: VAULT_OIDC_DISCOVERY_URL
          value: "https://auth.k8s.iaminyourpc.xyz/application/o/home-k8s/"
        - name: VAULT_OIDC_CLIENT_ID
          value: "home-k8s"
        - name: VAULT_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: data-authentik-home-k8s
              key: password
        - name: VAULT_OIDC_REDIRECT_URI
          value: "https://vault.k8s.iaminyourpc.xyz/ui/vault/auth/oidc/oidc/callback"
        - name: VAULT_POLICY_OIDC_NAME
          value: "admin"
        - name: VAULT_POLICY_OIDC_FILE
          value: "/policies/admin.hcl"
