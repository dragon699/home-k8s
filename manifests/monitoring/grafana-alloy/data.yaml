---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-grafana-alloy
  namespace: monitoring
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: home-vault
    kind: ClusterSecretStore
  target:
    name: auth-grafana-alloy
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: home/monitoring/auth-grafana-alloy
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-grafana-alloy
  namespace: monitoring
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: home-vault
    kind: ClusterSecretStore
  target:
    name: data-grafana-alloy
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: home/monitoring/data-grafana-alloy
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
