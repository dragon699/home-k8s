---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-alloy
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-url: https://auth.k8s.iaminyourpc.xyz/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://auth.k8s.iaminyourpc.xyz/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email
  labels:
    app: grafana-alloy
    env: home
spec:
  tls:
  - hosts:
    - alloy.k8s.iaminyourpc.xyz
    secretName: tls-alloy-k8s-iaminyourpc-xyz
  rules:
  - host: alloy.k8s.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: grafana-alloy
            port:
              number: 12345

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-alloy-otlp
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
