---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: discord
  namespace: monitoring
spec:
  route:
    receiver: system
    group_by: [alertname, namespace]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
    - receiver: car
      matchers: ['channel="car"']
    - receiver: stuff
      matchers: ['channel="stuff"']
  receivers:
  - name: system
    discord_configs:
    - webhook_url_secret:
        name: auth-vm-alerts-discord
        key: system
      send_resolved: true
  - name: car
    discord_configs:
    - webhook_url_secret:
        name: auth-vm-alerts-discord
        key: car
      send_resolved: true
  - name: stuff
    discord_configs:
    - webhook_url_secret:
        name: auth-vm-alerts-discord
        key: stuff
      send_resolved: true
