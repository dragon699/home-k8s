---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  image:
    repository: victoriametrics/victoria-metrics
    tag: v1.157.0
  ingestOnlyMode: true
  retentionPeriod: 15d
  storage:
    resources:
      requests:
        storage: 50Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 2Gi
  extraArgs:
    loggerFormat: json
    search.maxUniqueTimeseries: "300000"
    storage.cacheSizeIndexDBDataBlocks: 64MB
    storage.cacheSizeIndexDBTagFilters: 32MB
    maxLabelsPerTimeseries: "200"
    insert.maxQueueDuration: 3s
    maxConcurrentInserts: "12"
    memory.allowedPercent: "60"
    vmalert.proxyURL: http://vmalert-victoriametrics.monitoring.svc:8080
