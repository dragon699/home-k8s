---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vesync-exporter
  namespace: monitoring
  labels:
    app: vesync-exporter
    env: home
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vesync-exporter
  template:
    metadata:
      labels:
        app: vesync-exporter
        env: home
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: vesync-exporter
        image: skullfighter6/vesync-exporter:1.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 8000
        envFrom:
        - secretRef:
            name: auth-vesync
        env:
        - name: VESYNC_COUNTRY_CODE
          value: BG
        - name: POLL_INTERVAL_SECONDS
          value: "60"
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 30
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
