---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-exporter
  namespace: monitoring
  labels:
    app: jellyfin-exporter
    env: home
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: jellyfin-exporter
  template:
    metadata:
      labels:
        app: jellyfin-exporter
        env: home
    spec:
      restartPolicy: Always
      containers:
      - name: jellyfin-exporter
        image: rebelcore/jellyfin-exporter:v1.5.2
        imagePullPolicy: IfNotPresent
        args:
          - "--jellyfin.address=http://$(JELLYFIN_HOST)"
          - "--jellyfin.token=$(JELLYFIN_API_KEY)"
          - "--collector.activity"
          - "--collector.storage"
          - "--collector.tasks"
          - "--collector.transcoding"
        ports:
        - containerPort: 9594
        env:
        - name: JELLYFIN_HOST
          valueFrom:
            secretKeyRef:
              name: auth-jellyfin
              key: JELLYFIN_HOST
        - name: JELLYFIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: auth-jellyfin
              key: JELLYFIN_API_KEY
