---
apiVersion: v1
kind: Service
metadata:
  name: actual-exporter
  namespace: monitoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "3001"
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: actual-exporter
    port: 3001
    targetPort: metrics
  selector:
    app: actual-exporter
