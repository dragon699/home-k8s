---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-exporter
  namespace: monitoring
  labels:
    app: actual-exporter
    env: home
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: actual-exporter
  template:
    metadata:
      labels:
        app: actual-exporter
        env: home
    spec:
      restartPolicy: Always
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: actual-exporter
        image: sakowicz/actual-budget-prometheus-exporter:1.2.16
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 3001
        env:
        - name: ACTUAL_SERVER_URL
          value: "http://actual.actual.svc:5006"
        - name: ACTUAL_BUDGET_ID_1
          value: "109c0611-a822-4425-b7d1-cf6c87f1efcc"
        - name: ACTUAL_BUDGET_NAME_1
          value: "finances"
        - name: ACTUAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-actual
              key: ACTUAL_PASSWORD
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          tcpSocket:
            port: metrics
          periodSeconds: 15
        livenessProbe:
          tcpSocket:
            port: metrics
          periodSeconds: 30
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
