---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: monitoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "3903"
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: s3
    port: 3900
    targetPort: s3
  - name: admin
    port: 3903
    targetPort: admin
  selector:
    app: garage

---
apiVersion: v1
kind: Service
metadata:
  name: garage-webui
  namespace: monitoring
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3909
    targetPort: http
  selector:
    app: garage-webui

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-url: https://auth.k8s.iaminyourpc.xyz/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://auth.k8s.iaminyourpc.xyz/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email
    nginx.ingress.kubernetes.io/proxy-body-size: 1G
  labels:
    app: garage-webui
    env: home
spec:
  tls:
  - hosts:
    - garage.k8s.iaminyourpc.xyz
    secretName: tls-garage-k8s-iaminyourpc-xyz
  rules:
  - host: garage.k8s.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: garage-webui
            port:
              number: 3909
