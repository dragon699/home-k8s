---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radar
  namespace: radar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.8.0.0/24,92.247.208.224/32"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: auth-radar
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    # Live logs, exec and timeline use long-lived streams
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  labels:
    app: radar
    env: home
spec:
  tls:
  - hosts:
    - kube.k8s.iaminyourpc.xyz
    secretName: tls-kube-k8s-iaminyourpc-xyz
  rules:
  - host: kube.k8s.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: radar
            port:
              number: 9280

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radar
  namespace: radar
  labels:
    env: home
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radar
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 192.168.1.170/32
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openclaw
    ports:
    - protocol: TCP
      port: 9280
