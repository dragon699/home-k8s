---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: shared
spec:
  schedule: "0 3 * * *" # Every day at 03:00AM
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          volumes:
          - name: metrics
            hostPath:
              path: /var/lib/node-exporter/textfile
              type: Directory
          - name: script-pg-backup
            configMap:
              name: script-pg-backup
              defaultMode: 0755
          - name: auth-gcloud-storage
            secret:
              secretName: auth-gcloud-storage
              items:
                - key: key.json
                  path: key.json
          - name: backups
            hostPath:
              path: /media/martin/Data/Backups/home-k8s/PostgreSQL
              type: Directory
          containers:
          - name: pg-backup
            image: skullfighter6/python:3.13-utils-20261007
            imagePullPolicy: IfNotPresent
            volumeMounts:
            - name: metrics
              mountPath: /metrics
            - name: script-pg-backup
              mountPath: /scripts
            - name: auth-gcloud-storage
              mountPath: /var/run/gcp
              readOnly: true
            - name: backups
              mountPath: /backups
            command: ["/bin/sh", "-c", "set -e; python /scripts/backup.py --backup-pg-databases --enable-local-backup"]
            env:
            - name: METRICS_FILE
              value: "/metrics/cronjob_pg-backup.prom"
            - name: METRICS_CRONJOB
              value: "pg-backup"
            - name: DATABASES
              value: "teslamate-teslamate,immich,monitoring-grafana,vikunja,sparkyfitness,dawarich"
            - name: GCP_PROJECT
              value: "home-k8s"
            - name: GCP_BUCKET
              value: "all-dbs-backup"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOCAL_BACKUP_DIR
              value: "/backups"
            - name: AGE_PUBLIC_KEY
              value: "age170llv6tf2j4sgj6s6tvdycutptmqwsyl3ek3w74fjs4jfewqc5qqfqxsvf"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: data-postgresql-shared-teslamate-teslamate
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: data-postgresql-shared-teslamate-teslamate
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: data-postgresql-shared-teslamate-teslamate
                  key: user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-postgresql-shared-teslamate-teslamate
                  key: password
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/run/gcp/key.json"
