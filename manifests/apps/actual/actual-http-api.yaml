---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-http-api
  namespace: actual
  labels:
    app: actual-http-api
    env: home
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual-http-api
  template:
    metadata:
      labels:
        app: actual-http-api
        env: home
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        emptyDir: {}
      containers:
      - name: actual-http-api
        image: jhonderson/actual-http-api:26.10.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5007
        env:
        - name: ACTUAL_SERVER_URL
          value: "http://actual.actual.svc:5006"
        - name: ACTUAL_DATA_DIR
          value: "/data"
        - name: PORT
          value: "5007"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: auth-actual-http-api
              key: API_KEY
        - name: ACTUAL_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-actual-http-api
              key: ACTUAL_SERVER_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /v1/actualhttpapiversion
            port: 5007
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /v1/actualhttpapiversion
            port: 5007
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
