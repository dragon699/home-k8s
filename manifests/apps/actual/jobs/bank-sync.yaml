---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bank-sync
  namespace: actual
  labels:
    app: actual
    env: home
spec:
  schedule: "0 8,14,20 * * *"
  timeZone: Europe/Sofia
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: actual-bank-sync
            env: home
        spec:
          restartPolicy: Never
          volumes:
          - name: script-bank-sync
            configMap:
              name: script-bank-sync
          containers:
          - name: bank-sync
            image: skullfighter6/python:3.13-utils-20261007
            imagePullPolicy: IfNotPresent
            command: ["python", "/scripts/bank_sync.py"]
            env:
            - name: ACTUAL_MCP_URL
              value: "http://actual-mcp.mcp.svc:3000/mcp"
            - name: PYTHONUNBUFFERED
              value: "1"
            volumeMounts:
            - name: script-bank-sync
              mountPath: /scripts
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
