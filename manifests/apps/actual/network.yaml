---
apiVersion: v1
kind: Service
metadata:
  name: actual
  namespace: actual
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: actual
    port: 5006
    targetPort: 5006
  selector:
    app: actual

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual
  namespace: actual
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  labels:
    app: actual
    env: home
spec:
  tls:
  - hosts:
    - budget.iaminyourpc.xyz
    secretName: tls-budget-iaminyourpc-xyz
  rules:
  - host: budget.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: actual
            port:
              number: 5006
