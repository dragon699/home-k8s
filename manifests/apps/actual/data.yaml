---
apiVersion: v1
kind: ConfigMap
metadata:
  name: actual
  namespace: actual
  labels:
    app: actual
    env: home
data:
  ACTUAL_PORT: "5006"
  ACTUAL_LOGIN_METHOD: "openid"
  ACTUAL_ALLOWED_LOGIN_METHODS: "openid,password"
  ACTUAL_USER_CREATION_MODE: "manual"
  ACTUAL_OPENID_AUTH_METHOD: "oauth2"
  ACTUAL_OPENID_PROVIDER_NAME: "GitHub"
  ACTUAL_OPENID_AUTHORIZATION_ENDPOINT: "https://github.com/login/oauth/authorize"
  ACTUAL_OPENID_TOKEN_ENDPOINT: "https://github.com/login/oauth/access_token"
  ACTUAL_OPENID_USERINFO_ENDPOINT: "https://api.github.com/user"
  ACTUAL_OPENID_SERVER_HOSTNAME: "https://budget.iaminyourpc.xyz"
  ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB: "50"
  ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: "50"
  ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB: "100"
