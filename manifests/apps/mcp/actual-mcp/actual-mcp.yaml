---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-mcp
  namespace: mcp
  labels:
    app: actual-mcp
    env: home
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual-mcp
  template:
    metadata:
      labels:
        app: actual-mcp
        env: home
    spec:
      restartPolicy: Always
      volumes:
      - name: data
        emptyDir: {}
      containers:
      - name: actual-mcp
        image: skullfighter6/actual-mcp:v1.14.0-api26.10.0
        imagePullPolicy: IfNotPresent
        args: ["--sse", "--enable-write", "--port", "3000"]
        ports:
        - containerPort: 3000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: ACTUAL_SERVER_URL
          value: "http://actual.actual.svc:5006"
        - name: ACTUAL_BUDGET_SYNC_ID
          value: "109c0611-a822-4425-b7d1-cf6c87f1efcc"
        - name: ACTUAL_DATA_DIR
          value: "/data"
        - name: ACTUAL_SYNC_TTL_MS
          value: "60000"
        - name: ACTUAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-actual-mcp
              key: ACTUAL_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
