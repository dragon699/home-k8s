---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-teslamate-mcp
  namespace: mcp
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: home-vault
    kind: ClusterSecretStore
  target:
    name: auth-teslamate-mcp
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: home/mcp/auth-teslamate-mcp
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
