---
apiVersion: v1
kind: Service
metadata:
  name: vault-mcp
  namespace: mcp
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: vault-mcp
    port: 8080
    targetPort: 8080
  selector:
    app: vault-mcp

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-mcp
  namespace: mcp
  labels:
    env: home
spec:
  podSelector:
    matchLabels:
      app: vault-mcp
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openclaw
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: vault
    ports:
    - protocol: TCP
      port: 8200
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
