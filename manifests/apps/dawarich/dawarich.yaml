---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich
  namespace: dawarich
  labels:
    app: dawarich
    env: home
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dawarich
  template:
    metadata:
      labels:
        app: dawarich
        env: home
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
      - name: public
        persistentVolumeClaim:
          claimName: dawarich-public
      - name: watched
        persistentVolumeClaim:
          claimName: dawarich-watched
      - name: storage
        persistentVolumeClaim:
          claimName: dawarich-storage
      containers:
      - name: dawarich
        image: freikin/dawarich:1.19.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          export REDIS_URL="redis://:$(ruby -ruri -e 'print URI.encode_www_form_component(ENV.fetch("REDIS_PASSWORD"))')@${REDIS_HOST}"
          exec web-entrypoint.sh bin/rails server -p 3000 -b ::
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          periodSeconds: 10
          failureThreshold: 90
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          periodSeconds: 15
          failureThreshold: 4
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: public
          mountPath: /var/app/public
        - name: watched
          mountPath: /var/app/tmp/imports/watched
        - name: storage
          mountPath: /var/app/storage
        envFrom:
        - configMapRef:
            name: dawarich
        - secretRef:
            name: auth-dawarich
        env:
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: data-dawarich
              key: password
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: data-authentik-home-k8s
              key: password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-redis-shared
              key: password
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: data-postgresql-shared-dawarich
              key: dbname
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: data-postgresql-shared-dawarich
              key: user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-postgresql-shared-dawarich
              key: password
