---
apiVersion: v1
kind: Service
metadata:
  name: dawarich
  namespace: dawarich
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: dawarich
    port: 3000
    targetPort: 3000
  selector:
    app: dawarich

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dawarich
  namespace: dawarich
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 2G
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  labels:
    app: dawarich
    env: home
spec:
  tls:
  - hosts:
    - timeline.k8s.iaminyourpc.xyz
    secretName: tls-timeline-k8s-iaminyourpc-xyz
  rules:
  - host: timeline.k8s.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: dawarich
            port:
              number: 3000
