---
apiVersion: v1
kind: Service
metadata:
  name: tdashcam-studio
  namespace: tdashcam-studio
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: tdashcam-studio
    port: 80
    targetPort: 80
  selector:
    app: tdashcam-studio

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tdashcam-studio
  namespace: tdashcam-studio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-url: https://auth.k8s.iaminyourpc.xyz/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://auth.k8s.iaminyourpc.xyz/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email
  labels:
    app: tdashcam-studio
    env: home
spec:
  tls:
  - hosts:
    - dashcam.iaminyourpc.xyz
    secretName: tls-dashcam-iaminyourpc-xyz
  rules:
  - host: dashcam.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: tdashcam-studio
            port:
              number: 80
