---
apiVersion: v1
kind: Service
metadata:
  name: teslamate
  namespace: teslamate
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: teslamate
    port: 4000
    targetPort: 4000
  selector:
    app: teslamate

---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: teslamate
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: mosquitto
    port: 1883
    targetPort: 1883
  selector:
    app: mosquitto

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teslamate
  namespace: teslamate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-url: https://auth.k8s.iaminyourpc.xyz/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://auth.k8s.iaminyourpc.xyz/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email
  labels:
    app: teslamate
    env: home
spec:
  tls:
  - hosts:
    - car.k8s.iaminyourpc.xyz
    secretName: tls-car-k8s-iaminyourpc-xyz
  rules:
  - host: car.k8s.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: teslamate
            port:
              number: 4000
