---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speed-web
  namespace: speed
  labels:
    app: speed-web
    env: home
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: speed-web
  template:
    metadata:
      labels:
        app: speed-web
        env: home
    spec:
      restartPolicy: Always
      containers:
        - name: speed-web
          image: ghcr.io/dragon699/speed/web:0.3.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: config-speed-web
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
