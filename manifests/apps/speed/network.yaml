---
apiVersion: v1
kind: Service
metadata:
  name: speed-relay
  namespace: speed
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: speed-relay
    port: 8080
    targetPort: 8080
  selector:
    app: speed-relay

---
apiVersion: v1
kind: Service
metadata:
  name: speed-web
  namespace: speed
  labels:
    env: home
spec:
  type: ClusterIP
  ports:
  - name: speed-web
    port: 80
    targetPort: 80
  selector:
    app: speed-web

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speed
  namespace: speed
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/limit-connections: "20"
  labels:
    app: speed
    env: home
spec:
  tls:
  - hosts:
    - speed.iaminyourpc.xyz
    secretName: tls-speed-iaminyourpc-xyz
  rules:
  - host: speed.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: speed-web
            port:
              number: 80
