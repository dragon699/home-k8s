---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: auth-openclaw
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
  labels:
    app: openclaw
    env: home
spec:
  tls:
  - hosts:
    - stitch.iaminyourpc.xyz
    secretName: tls-stitch-iaminyourpc-xyz
  rules:
  - host: stitch.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: openclaw
            port:
              number: 18789
