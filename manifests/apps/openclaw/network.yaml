---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
  labels:
    app: openclaw
    env: home
spec:
  tls:
  - hosts:
    - stitch.iaminyourpc.xyz
    secretName: tls-stitch-iaminyourpc-xyz
  rules:
  - host: stitch.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: openclaw-main
            port:
              number: 18789

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw-mcp-apps
  namespace: openclaw
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-home
    kubernetes.io/ingress.class: nginx
  labels:
    app: openclaw
    env: home
spec:
  tls:
  - hosts:
    - apps.stitch.iaminyourpc.xyz
    secretName: tls-apps-stitch-iaminyourpc-xyz
  rules:
  - host: apps.stitch.iaminyourpc.xyz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: openclaw-mcp-apps
            port:
              number: 18790
