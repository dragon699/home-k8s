---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich-server
    env: home
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
        env: home
    spec:
      serviceAccount: default
      serviceAccountName: default
      automountServiceAccountToken: true
      enableServiceLinks: true
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      volumes:
      - name: library
        persistentVolumeClaim:
          claimName: immich-server-photos
      initContainers:
      - name: prepare-database
        image: skullfighter6/percona-postgresql-vectorchord:18.1-3-vchord0.5.3
        command: ["/bin/sh", "-ec"]
        args:
        - |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE immich IN DATABASE immich SET search_path = public;
          SET search_path = public;
          CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
          CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS unaccent;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          SQL
        env:
        - name: PGHOST
          value: "postgresql-shared-pg-ha.shared.svc"
        - name: PGSSLMODE
          value: "require"
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: data-postgresql-shared-immich
              key: dbname
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: data-postgresql-shared-immich
              key: user
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: data-postgresql-shared-immich
              key: password
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:v3.2.4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
          timeoutSeconds: 1
        startupProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 60
          timeoutSeconds: 1
        ports:
        - containerPort: 2283
        volumeMounts:
        - name: library
          mountPath: /usr/src/app/upload
        env:
        - name: IMMICH_MEDIA_LOCATION
          value: "/usr/src/app/upload"
        - name: UPLOAD_LOCATION
          value: "/usr/src/app/upload/library"
        - name: IMMICH_MACHINE_LEARNING_URL
          value: "http://immich-machine-learning.immich.svc:3003"
        - name: IMMICH_IGNORE_MOUNT_CHECK_ERRORS
          value: "true"
        - name: IMMICH_TELEMETRY_INCLUDE
          value: "all"
        - name: REDIS_HOSTNAME
          value: "redis-shared.shared.svc"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DBINDEX
          value: "2"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-redis-shared
              key: password
        - name: DB_VECTOR_EXTENSION
          value: "vectorchord"
        - name: DB_SSL_MODE
          value: "require"
        - name: DB_HOSTNAME
          value: "postgresql-shared-pg-ha.shared.svc"
        - name: DB_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: data-postgresql-shared-immich
              key: dbname
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: data-postgresql-shared-immich
              key: user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-postgresql-shared-immich
              key: password
