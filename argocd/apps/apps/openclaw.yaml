---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    env: home
spec:
  project: apps
  sources:
  - repoURL: git@github.com:dragon699/home-k8s.git
    targetRevision: main
    ref: values
  - repoURL: https://chrisbattarbee.github.io/openclaw-helm
    targetRevision: 0.1.12
    chart: openclaw
    helm:
      valueFiles:
      - '$values/helm/apps/openclaw/values.yaml'
  # - repoURL: git@github.com:dragon699/home-k8s.git
  #   targetRevision: main
  #   path: manifests/apps/openclaw
  #   directory:
  #     recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Validate=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
