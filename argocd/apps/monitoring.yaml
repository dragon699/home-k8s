---
projects:
  monitoring:
  - name: grafana
    sources:
    - repo: values_repo
      ref: values
    - repoURL: https://grafana-community.github.io/helm-charts
      targetRevision: 14.4.0
      chart: grafana
      helm:
        valueFiles:
        - $values/helm/monitoring/grafana/values.yaml
    - repo: gitops_repo
      path: manifests/monitoring/grafana
    target:
      namespace: monitoring

  - name: grafana-alloy
    sources:
    - repo: values_repo
      ref: values
    - repoURL: https://grafana.github.io/helm-charts
      targetRevision: 1.15.0
      chart: alloy
      helm:
        valueFiles:
        - $values/helm/monitoring/grafana-alloy/values.yaml
    - repo: gitops_repo
      path: manifests/monitoring/grafana-alloy
    target:
      namespace: monitoring

  - name: grafana-loki
    sources:
    - repo: values_repo
      ref: values
    - repoURL: https://grafana.github.io/helm-charts
      targetRevision: 7.5.0
      chart: loki
      helm:
        valueFiles:
        - $values/helm/monitoring/grafana-loki/values.yaml
    target:
      namespace: monitoring

  - name: grafana-tempo
    sources:
    - repo: values_repo
      ref: values
    - repoURL: https://grafana-community.github.io/helm-charts
      targetRevision: 3.2.1
      chart: tempo
      helm:
        valueFiles:
        - $values/helm/monitoring/grafana-tempo/values.yaml
    target:
      namespace: monitoring

  - name: metric-providers
    sources:
    - repo: values_repo
      ref: values
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 5.0.0
      chart: prometheus-node-exporter
      helm:
        releaseName: prometheus-node-exporter
        valueFiles:
        - $values/helm/monitoring/metric-providers/prometheus-node-exporter/values.yaml
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 12.0.0
      chart: prometheus-blackbox-exporter
      helm:
        releaseName: prometheus-blackbox-exporter
        valueFiles:
        - $values/helm/monitoring/metric-providers/prometheus-blackbox-exporter/values.yaml
    - repoURL: https://deckhouse.github.io/k8s-image-availability-exporter
      targetRevision: 0.19.0
      chart: k8s-image-availability-exporter
      helm:
        releaseName: k8s-image-availability-exporter
        valueFiles:
        - $values/helm/monitoring/metric-providers/k8s-image-availability-exporter/values.yaml
    - repoURL: oci://registry-1.docker.io/bitnamicharts/kube-state-metrics
      targetRevision: 5.1.0
      chart: kube-state-metrics
      helm:
        releaseName: kube-state-metrics
    - repo: gitops_repo
      path: manifests/monitoring/metric-providers/immich-exporter
    - repo: gitops_repo
      path: manifests/monitoring/metric-providers/pihole-exporter
    - repo: gitops_repo
      path: manifests/monitoring/metric-providers/jellyfin-exporter
    - repo: gitops_repo
      path: manifests/monitoring/metric-providers/vesync-exporter
    target:
      namespace: monitoring

  - name: garage
    sources:
    - repo: gitops_repo
      path: manifests/monitoring/garage
    target:
      namespace: monitoring

  - name: victoriametrics
    sources:
    - repo: values_repo
      ref: values
    - repoURL: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
      targetRevision: 33.0.2
      chart: prometheus-operator-crds
      helm:
        releaseName: prometheus-operator-crds
        valueFiles:
        - $values/helm/monitoring/victoriametrics/values-prometheus-operator-crds.yaml
    - repoURL: https://victoriametrics.github.io/helm-charts
      targetRevision: 0.68.2
      chart: victoria-metrics-operator
      helm:
        releaseName: victoriametrics-operator
        valueFiles:
        - $values/helm/monitoring/victoriametrics/values-victoriametrics-operator.yaml
    - repo: gitops_repo
      path: manifests/monitoring/victoriametrics
    target:
      namespace: monitoring

  - name: alerts
    sources:
    - repo: gitops_repo
      path: alerts
    target:
      namespace: monitoring
