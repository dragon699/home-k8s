      targetRevision: 1.7.3
      chart: sparkyfitness
      helm:
        valueFiles:
        - $values/helm/apps/sparkyfitness/values.yaml
    - repo: gitops_repo
      path: manifests/apps/sparkyfitness
    target:
      namespace: sparkyfitness

  - name: teslamate
    sources:
    - repo: gitops_repo
      path: manifests/apps/teslamate
    target:
      namespace: teslamate

  - name: vikunja
    sources:
    - repo: values_repo
      ref: values
    - repoURL: oci://ghcr.io/go-vikunja/helm-chart/vikunja
      targetRevision: v2.0.2
      chart: vikunja
      helm:
        valueFiles:
        - $values/helm/apps/vikunja/values.yaml
    - repo: gitops_repo
      path: manifests/apps/vikunja
