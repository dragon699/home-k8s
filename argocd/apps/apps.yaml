      helm:
        valueFiles:
        - $values/helm/apps/qbittorrent/values.yaml
    - repo: gitops_repo
      path: manifests/apps/qbittorrent
    target:
      namespace: qbittorrent

  - name: radar
    sources:
    - repo: values_repo
      ref: values
    - repoURL: https://skyhook-io.github.io/helm-charts
      targetRevision: 1.15.0
      chart: radar
      helm:
        valueFiles:
        - $values/helm/apps/radar/values.yaml
    - repo: gitops_repo
      path: manifests/apps/radar
    target:
      namespace: radar

  - name: redis-shared
    sources:
    - repo: values_repo
      ref: values
    - repoURL: https://ot-container-kit.github.io/helm-charts
      targetRevision: 0.22.2
      chart: redis-operator
    - repo: gitops_repo
