---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: csi-driver-not-healthy
spec:
  groups:
  - name: csi-driver-not-healthy
    rules:

    # Volumes cannot be created
    - alert: CSIDriverNotHealthy
      expr: |
        count by (namespace, persistentvolumeclaim) (
            kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          and on (namespace, persistentvolumeclaim)
            kube_persistentvolumeclaim_info{storageclass=~"longhorn.*"}
        ) > 0
      for: 15m
      labels:
        severity: major
        service: longhorn
        instance: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}"
      annotations:
        summary: Storage driver cannot create volumes
        description: |-
          Longhorn has not provisioned volume {{ $labels.persistentvolumeclaim }} for more than 15 minutes.
          Pods using it cannot start.
        value: Pending
        pendingVolumes: >-
          {{- with `kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1` | query | sortByLabel "persistentvolumeclaim" -}}
          {{ range $i, $e := . }}{{ if $i }}, {{ end }}{{ $e | label "namespace" }}/{{ $e | label "persistentvolumeclaim" }}{{ end }}
          {{- end }}

    # Volume lost redundancy or is unusable
    - alert: CSIDriverNotHealthy
      expr: |
        max by (pvc_namespace, pvc, volume, state) (
          longhorn_volume_robustness{state=~"degraded|faulted"}
        ) == 1
      for: 10m
      labels:
        severity: "{{ if eq $labels.state \"faulted\" }}critical{{ else }}major{{ end }}"
        service: longhorn
        instance: "{{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
      annotations:
        summary: Storage volume is not healthy
        description: |-
          Longhorn volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is {{ $labels.state }} for more than 10 minutes.
          {{ if eq $labels.state "faulted" }}All replicas failed, so the volume cannot be used.{{ else }}A replica failed, so the volume runs without its full redundancy.{{ end }}
        value: "{{ $labels.state }}"

    # Storage node or disk is not available
    - alert: CSIDriverNotHealthy
      expr: |
        max by (node, condition) (longhorn_node_status{condition="ready"}) == 0
          or
        max by (node, disk, condition) (longhorn_disk_status{condition="ready"}) == 0
      for: 15m
      labels:
        severity: major
        service: longhorn
        instance: "{{ $labels.node }}{{ with $labels.disk }}/{{ . }}{{ end }}"
      annotations:
        summary: Storage backend is not available
        description: |-
          Longhorn reports that {{ with $labels.disk }}disk {{ . }} on {{ end }}node {{ $labels.node }} is not ready for more than 15 minutes.
          Volumes on it may fail to attach, resize or get new replicas.
        value: Not ready
