---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbao-is-sealed
spec:
  groups:
  - name: openbao-is-sealed
    rules:
    - alert: OpenbaoIsSealed
      expr: |
        max by (namespace, pod) (vault_core_unsealed) == 0
      for: 3m
      labels:
        severity: critical
        group: resource
        service: "{{ $labels.namespace }}"
        instance: "{{ $labels.namespace }}/{{ $labels.pod }}"
      annotations:
        summary: OpenBao is sealed
        description: |-
          OpenBao pod {{ $labels.pod }} has been sealed for more than 3 minutes.
          Openbao cannot be used and secrets are not accessible until unsealed.
        value: Sealed
