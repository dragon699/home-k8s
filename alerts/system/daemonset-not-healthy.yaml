---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: daemonset-not-healthy
spec:
  groups:
  - name: daemonset-not-healthy
    rules:
    - alert: DaemonSetNotHealthy
      expr: |
        sum by (namespace, daemonset) (
          kube_daemonset_status_desired_number_scheduled - kube_daemonset_status_current_number_scheduled
        ) > 0
      for: 15m
      labels:
        severity: major
        group: workload
        service: "{{ $labels.namespace }}"
        instance: "{{ $labels.namespace }}/{{ $labels.daemonset }}"
        node: >-
          {{- $missing := printf "%.0f" $value -}}
          {{- $all := printf `kube_node_info unless on (node) (kube_pod_info * on (namespace, pod) group_left () kube_pod_owner{namespace="%s",owner_kind="DaemonSet",owner_name="%s"})` $labels.namespace $labels.daemonset | query | sortByLabel "node" -}}
          {{- $untainted := printf `kube_node_info unless on (node) (kube_pod_info * on (namespace, pod) group_left () kube_pod_owner{namespace="%s",owner_kind="DaemonSet",owner_name="%s"}) unless on (node) kube_node_spec_taint{effect=~"NoSchedule|NoExecute"}` $labels.namespace $labels.daemonset | query | sortByLabel "node" -}}
          {{- if eq (printf "%d" (len $all)) $missing -}}
          {{ range $i, $e := $all }}{{ if $i }}, {{ end }}{{ $e | label "node" }}{{ end }}
          {{- else if eq (printf "%d" (len $untainted)) $missing -}}
          {{ range $i, $e := $untainted }}{{ if $i }}, {{ end }}{{ $e | label "node" }}{{ end }}
          {{- end }}
      annotations:
        summary: DaemonSet has nodes without a pod
        description: DaemonSet {{ $labels.daemonset }} has no pod on {{ $value | printf "%.0f" }} node(s) for more than 15 minutes.
        value: '{{ $value | printf "%.0f" }} node(s) without pod'
