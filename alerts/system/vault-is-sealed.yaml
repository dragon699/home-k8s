---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vault-is-sealed
spec:
  groups:
  - name: vault-is-sealed
    rules:
    - alert: VaultIsSealed
      expr: |
        max by (namespace, pod) (vault_core_unsealed) == 0
      for: 5m
      labels:
        severity: critical
        service: "{{ $labels.namespace }}"
        instance: "{{ $labels.namespace }}/{{ $labels.pod }}"
      annotations:
        summary: Vault is sealed
        description: |-
          Vault pod {{ $labels.pod }} has been sealed for more than 5 minutes.
          Vault cannot be used and secrets are not accessible until unsealed.
        value: Sealed
