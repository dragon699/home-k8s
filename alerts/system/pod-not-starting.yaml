---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-not-starting
spec:
  groups:
  - name: pod-not-starting
    rules:
    - alert: PodNotStarting
      expr: |
        sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) > 0
        unless on (namespace, pod) (
            kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName|ErrImageNeverPull|ImageInspectError"}
          or
            kube_pod_init_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName|ErrImageNeverPull|ImageInspectError|CrashLoopBackOff"}
        )
      for: 15m
      labels:
        severity: major
        group: workload
        service: "{{ $labels.namespace }}"
        instance: "{{ $labels.namespace }}/{{ $labels.pod }}"
        container: >-
          {{- with printf `kube_pod_container_status_waiting_reason{namespace="%s",pod="%s"} == 1 or kube_pod_init_container_status_waiting_reason{namespace="%s",pod="%s"} == 1` $labels.namespace $labels.pod $labels.namespace $labels.pod | query | sortByLabel "container" -}}
          {{ range $i, $e := . }}{{ if $i }}, {{ end }}{{ $e | label "container" }}{{ end }}
          {{- end }}
      annotations:
        summary: Pod is not starting
        description: Pod {{ $labels.pod }} has been stuck in Pending state for more than 15 minutes.
        value: >-
          {{- with printf `kube_pod_status_unschedulable{namespace="%s",pod="%s"} == 1` $labels.namespace $labels.pod | query -}}
          Unschedulable
          {{- else -}}
          {{- with printf `kube_pod_container_status_waiting_reason{namespace="%s",pod="%s"} == 1 or kube_pod_init_container_status_waiting_reason{namespace="%s",pod="%s"} == 1` $labels.namespace $labels.pod $labels.namespace $labels.pod | query -}}
          {{ . | first | label "reason" }}
          {{- end -}}
          {{- end }}
