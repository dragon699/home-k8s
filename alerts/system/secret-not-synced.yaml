---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secret-not-synced
spec:
  groups:
  - name: secret-not-synced
    rules:
    - alert: SecretNotSynced
      expr: |
        max by (namespace, name) (
          label_replace(
            externalsecret_status_condition{condition="Ready", status="False"},
            "namespace", "$1", "exported_namespace", "(.+)"
          )
        ) == 1
        unless on () (
            count(externalsecret_status_condition{condition="Ready", status="False"} == 1) > 5
          and on ()
            ALERTS{alertname="ESOIsBroken", alertstate="firing"}
        )
      for: 30m
      labels:
        severity: major
        group: resource
        service: "{{ $labels.namespace }}"
        instance: "{{ $labels.namespace }}/{{ $labels.name }}"
      annotations:
        summary: ExternalSecret is not synced
        description: |-
          ExternalSecret {{ $labels.name }} could not be synced for more than 30 minutes.
        value: Not synced
