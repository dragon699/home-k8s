---
apiVersion: provisioning.grafana.app/v0alpha1
kind: Repository
metadata:
  name: repository-stitch-dashboards
  namespace: default
spec:
  title: stitch's dashboards
  workflows:
  - write
  sync:
    enabled: true
    target: folder
    intervalSeconds: 3600
  type: git
  git:
    url: ${DASHBOARDS_GIT_REPO_URL}
    branch: ${DASHBOARDS_GIT_REPO_BRANCH}
    tokenUser: "${DASHBOARDS_GIT_TOKEN_USER}"
secure:
  token:
    create: "${DASHBOARDS_GIT_TOKEN}"
