apiVersion: 1
prune: true

datasources:

- name: Loki
  type: loki
  uid: internal-loki
  url: http://grafana-loki-gateway.monitoring.svc:80
  access: proxy
  isDefault: true
  editable: false
  orgId: 1
  jsonData:
    derivedFields:
    - name: "Reveal traces"
      datasourceUid: internal-tempo
      targetBlank: true
      matcherRegex: "traceID"
      matcherType: label
      url: "$${__value.raw}"
    - name: "Reveal traces "
      datasourceUid: internal-tempo
      targetBlank: true
      matcherRegex: "trace_id"
      matcherType: label
      url: "$${__value.raw}"
    - name: "Reveal traces  "
      datasourceUid: internal-tempo
      targetBlank: true
      matcherRegex: "Trace_ID"
      matcherType: label
      url: "$${__value.raw}"

- name: Victoriametrics
  type: prometheus
  uid: internal-victoriametrics
  url: http://victoriametrics-vmselect.monitoring.svc:8481/select/0/prometheus
  access: proxy
  isDefault: false
  editable: false
  orgId: 1
  jsonData:
    httpMethod: POST

- name: Tempo
  type: tempo
  uid: internal-tempo
  url: http://grafana-tempo-query-frontend.monitoring.svc:3200
  access: proxy
  isDefault: false
  editable: false
  orgId: 1
  jsonData:
    nodeGraph:
      enabled: true
    streamingEnabled:
      search: false
    serviceMap:
      datasourceUid: internal-victoriametrics
    tracesToMetrics:
      datasourceUid: internal-victoriametrics
      queries: []
    tracesToLogsV2:
      datasourceUid: internal-loki
      customQuery: false
      query: ""
      filterByTraceID: true
      filterBySpanID: false
      spanStartTimeShift: "-15m"
      spanEndTimeShift: "15m"
      tags:
      - key: service.name
        value: app

- name: Teslamate
  type: grafana-postgresql-datasource
  uid: internal-teslamate
  url: ${pg-teslamate-pgbouncer-host}:${pg-teslamate-pgbouncer-port}
  access: proxy
  isDefault: false
  editable: false
  orgId: 1
  basicAuth: false
  user: ${pg-teslamate-user}
  jsonData:
    database: ${pg-teslamate-dbname}
    connMaxLifetime: 14400
    maxIdleConns: 500
    maxIdleConnsAuto: true
    maxOpenConns: 500
    postgresVersion: 1500
    sslmode: disable
  secureJsonData:
    password: ${pg-teslamate-password}

- name: Dawarich
  type: grafana-postgresql-datasource
  uid: internal-dawarich
  url: ${pg-dawarich-pgbouncer-host}:${pg-dawarich-pgbouncer-port}
  access: proxy
  isDefault: false
  editable: false
  orgId: 1
  basicAuth: false
  user: ${pg-dawarich-user}
  jsonData:
    database: ${pg-dawarich-dbname}
    connMaxLifetime: 14400
    maxIdleConns: 500
    maxIdleConnsAuto: true
    maxOpenConns: 500
    postgresVersion: 1500
    sslmode: disable
  secureJsonData:
    password: ${pg-dawarich-password}

- name: Immich
  type: yesoreyeram-infinity-datasource
  uid: internal-immich
  url: ${immich-grafana-IMMICH_URL}:${immich-grafana-IMMICH_PORT}
  access: proxy
  isDefault: false
  editable: false
  orgId: 1
  jsonData:
    auth_method: none
    allowedHosts:
    - ${immich-grafana-IMMICH_URL}:${immich-grafana-IMMICH_PORT}
    httpHeaderName1: x-api-key
    customHealthCheckEnabled: true
    customHealthCheckUrl: ${immich-grafana-IMMICH_URL}:${immich-grafana-IMMICH_PORT}/api/server/version
  secureJsonData:
    httpHeaderValue1: ${immich-grafana-IMMICH_API_KEY}

- name: Actual
  type: yesoreyeram-infinity-datasource
  uid: internal-actual
  url: http://actual-http-api.actual.svc:5007
  access: proxy
  isDefault: false
  editable: false
  orgId: 1
  jsonData:
    auth_method: none
    allowedHosts:
    - http://actual-http-api.actual.svc:5007
    httpHeaderName1: x-api-key
    customHealthCheckEnabled: true
    customHealthCheckUrl: http://actual-http-api.actual.svc:5007/v1/budgets/109c0611-a822-4425-b7d1-cf6c87f1efcc/accounts
  secureJsonData:
    httpHeaderValue1: ${actual-grafana-ACTUAL_API_KEY}

- name: Jellyfin
  type: yesoreyeram-infinity-datasource
  uid: internal-jellyfin
  url: ${jellyfin-grafana-JELLYFIN_URL}:${jellyfin-grafana-JELLYFIN_PORT}
  access: proxy
  isDefault: false
  editable: false
  orgId: 1
  jsonData:
    auth_method: none
    allowedHosts:
    - ${jellyfin-grafana-JELLYFIN_URL}:${jellyfin-grafana-JELLYFIN_PORT}
    httpHeaderName1: X-Emby-Token
    customHealthCheckEnabled: true
    customHealthCheckUrl: ${jellyfin-grafana-JELLYFIN_URL}:${jellyfin-grafana-JELLYFIN_PORT}/System/Info
  secureJsonData:
    httpHeaderValue1: ${jellyfin-grafana-JELLYFIN_API_KEY}

- name: TMDb
  type: yesoreyeram-infinity-datasource
  uid: internal-tmdb
  url: ${tmdb-grafana-TMDB_URL}
  access: proxy
  isDefault: false
  editable: false
  orgId: 1
  jsonData:
    auth_method: bearerToken
    allowedHosts:
    - ${tmdb-grafana-TMDB_URL}
    customHealthCheckEnabled: true
    customHealthCheckUrl: ${tmdb-grafana-TMDB_URL}/3/authentication
  secureJsonData:
    bearerToken: ${tmdb-grafana-TMDB_TOKEN}
