// Configuration

logging {
  // Beyla subprocess output (including its warnings) is logged at info.
  level  = "info"
  format = "logfmt"
}

// Turn on to see live data coming in/out
livedebugging {
  enabled = false
}

// Data pipelines

//////////////////////////////////////////////
// Collect traces and metrics from OTLP-based sources
//////////////////////////////////////////////

// Create internal OTLP receiver for traces and metrics
otelcol.receiver.otlp "home_otelcol" {
  http {
    endpoint                   = "0.0.0.0:4318"
  }

  output {
    metrics                    = [otelcol.processor.deltatocumulative.home_otelcol.input]
    traces                     = [otelcol.processor.batch.home_otelcol.input]
  }
}

// Convert delta to cumulative metrics
otelcol.processor.deltatocumulative "home_otelcol" {
  output {
    metrics                    = [otelcol.processor.batch.home_otelcol.input]
  }
}

// Batch traces and metrics
otelcol.processor.batch "home_otelcol" {
  timeout                      = "10s"
  send_batch_size              = 512

  output {
    metrics                    = [otelcol.exporter.prometheus.home_otelcol.input]
    traces                     = [otelcol.exporter.otlphttp.home_otelcol.input]
  }
}

// Convert metrics from OTLP to Prometheus-based format
otelcol.exporter.prometheus "home_otelcol" {
  forward_to                   = [prometheus.remote_write.home_otelcol.receiver]
}

// Write metrics to VictoriaMetrics via Remote Write
prometheus.remote_write "home_otelcol" {
  endpoint {
    url                        = sys.env("ENDPOINT_VICTORIAMETRICS")
  }
}

// Write traces to Tempo
otelcol.exporter.otlphttp "home_otelcol" {
  client {
    endpoint                   = sys.env("ENDPOINT_TEMPO_OTLPHTTP")

    tls {
      insecure                 = true
      insecure_skip_verify     = true
    }
  }
}

//////////////////////////////////////////////


//////////////////////////////////////////////
// Collect logs from kubernetes pods
//////////////////////////////////////////////

// Discover pods
discovery.kubernetes "home_logs" {
  role            = "pod"
}

// [1] Aggregate logs
// Scrape logs from pods
discovery.relabel "home_logs" {
  targets         = discovery.kubernetes.home_logs.targets

  rule {
    source_labels = ["__meta_kubernetes_namespace"]
    action        = "replace"
    target_label  = "namespace"
  }

  rule {
    source_labels = ["__meta_kubernetes_pod_name"]
    action        = "replace"
    target_label  = "pod"
  }

  rule {
    source_labels = ["__meta_kubernetes_pod_container_name"]
    action        = "replace"
    target_label  = "container"
  }

  rule {
    source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
    action        = "replace"
    target_label  = "app"
  }

  rule {
    source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
    action        = "replace"
    target_label  = "job"
    separator     = "/"
    replacement   = "$1"
  }

  rule {
    source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_container_name"]
    action        = "replace"
    target_label  = "instance"
    regex         = "(.*);(.*);(.*)"
    replacement   = "$1/$2:$3"
  }

  rule {
    source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
    action        = "replace"
    target_label  = "__path__"
    separator     = "/"
    replacement   = "/var/log/pods/*$1/*.log"
  }

  rule {
    source_labels = ["__meta_kubernetes_pod_container_id"]
    action        = "replace"
    target_label  = "container_runtime"
    regex         = "^(\\S+):\\/\\/.+$"
    replacement   = "$1"
  }
}

// Resolve the __path__ globs to the pods' log files on the node
local.file_match "home_logs" {
  path_targets    = discovery.relabel.home_logs.output
}

// Tail pod logs from /var/log/pods
loki.source.file "home_logs" {
  targets         = local.file_match.home_logs.targets
  forward_to      = [loki.process.home_logs.receiver]
  tail_from_end   = true
}

// Tail k8s events
loki.source.kubernetes_events "home_k8s_events" {
  log_format      = "json"
  forward_to      = [loki.process.home_k8s_events.receiver]
}

// [2] Aggregate logs
// Relabel logs
loki.process "home_logs" {
  stage.cri {}

  stage.label_drop {
    values        = ["stream", "filename"]
  }

  stage.static_labels {
    values        = {
      "cluster"   = "home-k8s",
      "source"    = "kubernetes-logs",
    }
  }

  stage.match {
    selector      = "{namespace=\"kube-system\", container=\"konnectivity-agent\"}"

    stage.drop {
      expression          = "^I\\d{4} "
      drop_counter_reason = "konnectivity_info"
    }
  }

  forward_to      = [loki.write.home_logs.receiver]
}

// Aggregate events
loki.process "home_k8s_events" {
  stage.static_labels {
    values        = {
      "cluster"   = "home-k8s",
      "source"    = "kubernetes-events",
    }
  }

  forward_to      = [loki.write.home_logs.receiver]
}

// Write logs to Loki
loki.write "home_logs" {
  endpoint {
    url           = sys.env("ENDPOINT_LOKI")
  }
}

//////////////////////////////////////////////



//////////////////////////////////////////////
// Collect metrics and traces from kubernetes pods
//////////////////////////////////////////////

// Auto-instrument collection of metrics and traces using Beyla
beyla.ebpf "home_discovery" {
  enforce_sys_caps             = true

  attributes {
    kubernetes {
      enable                   = "true"
      cluster_name             = "home-k8s"
    }

    select {
      attr                     = "*"
      include                  = ["*"]
      exclude                  = ["nothing"]
    }

    // Network flows: keep only the k8s-level attributes Radar's traffic map uses.
    // Ephemeral ports, IPs and interfaces made the series count unbounded.
    select {
      attr                     = "beyla_network_flow_bytes"
      exclude                  = ["src.port", "dst.port", "src.address", "dst.address", "src.name", "dst.name", "iface", "iface.direction", "beyla.ip", "client.port", "server.port", "src.zone", "dst.zone", "k8s.src.node.ip", "k8s.dst.node.ip", "k8s.src.node.name", "k8s.dst.node.name"]
    }
  }

  discovery {
    instrument {
      kubernetes {
        namespace              = "*"
      }
      exports                  = ["metrics", "traces"]
    }

    exclude_instrument         { kubernetes { namespace = "default" } }
    exclude_instrument         { kubernetes { namespace = "k0s-autopilot" } }
    exclude_instrument         { kubernetes { namespace = "kube-*" } }
    exclude_instrument         { kubernetes { namespace = "cert-manager" } }
    exclude_instrument         { kubernetes { namespace = "radar" } }
    exclude_instrument         { kubernetes { namespace = "longhorn" } }
    exclude_instrument         { kubernetes { namespace = "monitoring" } }
    exclude_instrument         { kubernetes { namespace = "speedtest" } }
    exclude_instrument         { kubernetes { namespace = "fetch-api" } }
  }

  ebpf {
    context_propagation        = "all"
    track_request_headers      = true
    high_request_volume        = true
    heuristic_sql_detect       = false
  }

  traces {
    instrumentations           = ["*"]
  }

  metrics {
    instrumentations           = ["*"]
    features = [
      "application",
      "application_process",
      "application_service_graph",
      "network",
    ]

    network {
      cache_active_timeout     = "14s"
      exclude_interfaces       = ["lo", "docker0", "/^br-/", "/^veth/", "vxlan.calico"]
      exclude_protocols        = ["UDP"]
    }
  }

  output {
    traces                     = [otelcol.processor.batch.home_traces_otlphttp.input]
  }
}

// Create internal OTLP receiver for traces
otelcol.receiver.otlp "home_traces_otlpgrpc" {
  grpc {
    endpoint                   = "0.0.0.0:4317"
  }

  output {
    traces                     = [otelcol.processor.batch.home_traces_otlpgrpc.input]
  }
}

// Batch OTLP traces
otelcol.processor.batch "home_traces_otlpgrpc" {
  timeout                      = "10s"
  send_batch_size              = 512

  output {
    traces                     = [otelcol.exporter.otlp.home_traces_otlpgrpc.input]
  }
}

// Batch OTLPHTTP traces
otelcol.processor.batch "home_traces_otlphttp" {
  timeout                      = "10s"
  send_batch_size              = 512

  output {
    traces                     = [otelcol.processor.span.home_spans_success_otlphttp.input]
  }
}

// Detect successful spans
otelcol.processor.span "home_spans_success_otlphttp" {
  include {
    match_type                 = "regexp"

    attribute {
      key                      = "http.response.status_code"
      value                    = "2[0-9]{2}"
    }
  }

  status {
    code                       = "Ok"
  }

  output {
    traces                     = [otelcol.processor.span.home_spans_fail_otlphttp.input]
  }
}

// Detect failed spans
otelcol.processor.span "home_spans_fail_otlphttp" {
  include {
    match_type                 = "regexp"

    attribute {
      key                      = "http.response.status_code"
      value                    = "5[0-9]{2}|4[0-9]{2}"
    }
  }

  status {
    code                       = "Error"
  }

  output {
    traces                     = [otelcol.exporter.otlphttp.home_traces_otlphttp.input]
  }
}

// Write traces to Tempo using gRPC
otelcol.exporter.otlp "home_traces_otlpgrpc" {
  client {
    endpoint                   = sys.env("ENDPOINT_TEMPO_GRPC")

    tls {
      insecure                 = true
      insecure_skip_verify     = true
    }
  }
}

// Write traces to Tempo using OTLPHTTP
otelcol.exporter.otlphttp "home_traces_otlphttp" {
  client {
    endpoint                   = sys.env("ENDPOINT_TEMPO_OTLPHTTP")

    tls {
      insecure                 = true
      insecure_skip_verify     = true
    }
  }
}

// Scrape metrics from Beyla
prometheus.scrape "home_metrics" {
  targets                      = beyla.ebpf.home_discovery.targets

  honor_labels                 = true
  scrape_interval              = "15s"

  forward_to                   = [prometheus.relabel.home_metrics.receiver]
}

// Relabel metrics
prometheus.relabel "home_metrics" {
  // Drop unneeded IPs from trace service graph metrics of kind=server
  rule {
    source_labels              = ["source", "server"]
    regex                      = "beyla;[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}"
    action                     = "drop"
  }

  // Stack external IPs in trace service graph metrics of kind=client
  rule {
    source_labels              = ["server", "client"]
    regex                      = "skull-pc;([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
    target_label               = "client_address"
    replacement                = "$1"
  }

  rule {
    source_labels              = ["server", "client_address"]
    regex                      = "skull-pc;[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}"
    target_label               = "client"
    replacement                = "external-ip"
  }

  rule {
    target_label               = "cluster"
    replacement                = "home-k8s"
  }

  rule {
    source_labels              = ["__name__"]
    regex                      = "beyla_.*"
    target_label               = "job"
    replacement                = "beyla"
  }

  rule {
    source_labels              = ["__name__"]
    regex                      = "beyla_.*"
    target_label               = "cluster"
    replacement                = ""
  }

  forward_to                   = [prometheus.remote_write.home_metrics.receiver]
}

// Write metrics to VictoriaMetrics
prometheus.remote_write "home_metrics" {
  endpoint {
    url                        = sys.env("ENDPOINT_VICTORIAMETRICS")
  }
}

