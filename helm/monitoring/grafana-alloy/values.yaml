image:
  tag: v1.20.1

controller:
  replicas: 1
  type: deployment
  # One host-networked collector owns the OTLP ports and eBPF hooks.
  updateStrategy:
    type: Recreate

  hostPID: true
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  volumes:
    extra:
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup
    - name: tracefs
      hostPath:
        path: /sys/kernel/tracing
        type: Directory

alloy:
  resources:
    requests:
      cpu: 0.2
      memory: 256Mi
    limits:
      cpu: 4
      memory: 3Gi

  clustering:
    enabled: false

  securityContext:
    privileged: true

  extraPorts:
  - name: "otlp-grpc"
    protocol: "TCP"
    port: 4317
    targetPort: 4317
  - name: "otlp-http"
    protocol: "TCP"
    port: 4318
    targetPort: 4318

  stabilityLevel: "experimental"

  mounts:
    extra:
    - name: cgroup
      mountPath: /sys/fs/cgroup
    - name: tracefs
      mountPath: /sys/kernel/tracing

  configMap:
    create: false
    name: config-grafana-alloy-pipelines
    key: alloy.yaml

  envFrom:
  - configMapRef:
      name: config-grafana-alloy
  - secretRef:
      name: data-grafana-alloy
