image:
  tag: v1.20.1

controller:
  revisionHistoryLimit: 1
  replicas: 1
  extraAnnotations:
    secret.reloader.stakater.com/reload: "data-grafana-alloy"
  type: deployment
  updateStrategy:
    type: Recreate

  hostPID: true
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  volumes:
    extra:
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup
    - name: tracefs
      hostPath:
        path: /sys/kernel/tracing
        type: Directory
    - name: storage
      hostPath:
        path: /var/lib/alloy
        type: DirectoryOrCreate

alloy:
  resources:
    requests:
      cpu: 0.2
      memory: 1Gi
    limits:
      cpu: 4
      memory: 6Gi

  extraEnv:
  # Soft heap target for Alloy (and its Beyla subprocess, which inherits it).
  # Keep it well above the steady-state heap, or GC runs nonstop and burns the CPU limit.
  - name: GOMEMLIMIT
    value: 4GiB

  clustering:
    enabled: false

  securityContext:
    privileged: true

  extraPorts:
  - name: "otlp-grpc"
    protocol: "TCP"
    port: 4317
    targetPort: 4317
  - name: "otlp-http"
    protocol: "TCP"
    port: 4318
    targetPort: 4318

  stabilityLevel: "experimental"

  storagePath: /var/lib/alloy

  mounts:
    # Pod log files (/var/log/pods), read by loki.source.file
    varlog: true
    extra:
    - name: cgroup
      mountPath: /sys/fs/cgroup
    - name: tracefs
      mountPath: /sys/kernel/tracing
    - name: storage
      mountPath: /var/lib/alloy

  configMap:
    create: false
    name: config-grafana-alloy-pipelines
    key: alloy.yaml

  envFrom:
  - configMapRef:
      name: config-grafana-alloy
  - secretRef:
      name: data-grafana-alloy
