image:
  tag: v1.20.1

controller:
  revisionHistoryLimit: 1
  replicas: 0 # Temporarily disabled, restore to 1
  extraAnnotations:
    secret.reloader.stakater.com/reload: "data-grafana-alloy"
  type: deployment
  updateStrategy:
    type: Recreate

  hostPID: true
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  volumes:
    extra:
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup
    - name: tracefs
      hostPath:
        path: /sys/kernel/tracing
        type: Directory

alloy:
  resources:
    requests:
      cpu: 0.2
      memory: 1Gi
    limits:
      cpu: 4
      # Alloy and its Beyla subprocess share this container limit.
      memory: 6Gi

  extraEnv:
  # Each Go process inherits this advisory heap budget; leave headroom for
  # both processes, eBPF maps, and non-Go allocations under the shared limit.
  - name: GOMEMLIMIT
    value: 1536MiB

  clustering:
    enabled: false

  securityContext:
    privileged: true

  extraPorts:
  - name: "otlp-grpc"
    protocol: "TCP"
    port: 4317
    targetPort: 4317
  - name: "otlp-http"
    protocol: "TCP"
    port: 4318
    targetPort: 4318

  stabilityLevel: "experimental"

  mounts:
    extra:
    - name: cgroup
      mountPath: /sys/fs/cgroup
    - name: tracefs
      mountPath: /sys/kernel/tracing

  configMap:
    create: false
    name: config-grafana-alloy-pipelines
    key: alloy.yaml

  envFrom:
  - configMapRef:
      name: config-grafana-alloy
  - secretRef:
      name: data-grafana-alloy
