grafana:
  url: "http://grafana.monitoring.svc"
  apiKeySecret:
    name: auth-grafana
    key: GRAFANA_SA_TOKEN

extraArgs:
- -transport
- streamable-http
- -address
- 0.0.0.0:8000
- -allowed-hosts
- grafana-mcp.monitoring.svc.cluster.local:8000,grafana-mcp.monitoring.svc:8000,grafana-mcp.monitoring:8000
