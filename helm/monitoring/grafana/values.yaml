revisionHistoryLimit: 1

replicas: 1

annotations:
  reloader.stakater.com/auto: "true"

deploymentStrategy:
  type: Recreate

resources:
  requests:
    cpu: 0.1
    memory: 128Mi
  limits:
    cpu: 4
    memory: 3Gi

persistence:
  enabled: false

imageRenderer:
  revisionHistoryLimit: 1
  enabled: true
  image:
    tag: v5.12.5
  # The chart's generated token relies on Helm lookup, which Argo CD doesn't support,
  # so it was regenerated on every sync and broke rendering with 401s
  existingSecret: auth-grafana-image-renderer
  annotations:
    reloader.stakater.com/auto: "true"

envFromSecrets:
- name: data-postgresql-shared-monitoring-grafana
  prefix: pg-grafana-
  optional: false
- name: data-postgresql-shared-teslamate-teslamate
  prefix: pg-teslamate-
  optional: false

admin:
  existingSecret: auth-grafana
  userKey: GRAFANA_ADMIN_USER
  passwordKey: GRAFANA_ADMIN_PASSWORD

plugins:
- volkovlabs-image-panel
- yesoreyeram-infinity-datasource

grafana.ini:
  server:
    root_url: https://grafana.k8s.iaminyourpc.xyz
    router_logging: true

  date_formats:
    default_timezone: Europe/Sofia

  log:
    mode: console
    level: debug

  log.frontend:
    instrumentations_tracing_enabled: false

  unified_alerting.screenshots:
    capture: true
    upload_external_image_storage: true

  external_image_storage:
    provider: local

  auth.anonymous:
    hide_version: true

  auth:
    login_maximum_lifetime_duration: 3d
    login_maximum_inactive_lifetime_duration: 2h
    login_cookie_name: __Host-grafana_session

  security:
    cookie_secure: true
    cookie_samesite: strict
    content_security_policy: true

  database:
    type: postgres
    host: ${pg-grafana-pgbouncer-host}:${pg-grafana-pgbouncer-port}
    name: ${pg-grafana-dbname}
    user: ${pg-grafana-user}
    password: ${pg-grafana-password}
    ssl_mode: disable

  feature_toggles:
    enable: nestedFolders
    provisioning: true
    kubernetesDashboards: true
    kubernetesClientDashboardsFolders: true
    grafanaAPIServerEnsureKubectlAccess: true

  users:
    viewers_can_edit: true

  unified_storage.folders.folder.grafana.app:
    enableMigration: true
  unified_storage.dashboards.dashboard.grafana.app:
    enableMigration: true


# Grafana provisioning
# Dashboards sourced via GitSync (@dashboards repo)
extraVolumes:
- name: datasources
  configMap:
    name: config-grafana-datasources


extraVolumeMounts:
- name: datasources
  mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
  subPath: datasources.yaml
