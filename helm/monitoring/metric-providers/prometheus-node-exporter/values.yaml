revisionHistoryLimit: 1

resources:
  requests:
    cpu: 0.1
    memory: 16Mi
  limits:
    cpu: 0.5
    memory: 128Mi

extraArgs:
- --collector.disable-defaults
- --collector.cpu
- --collector.diskstats
- --collector.filesystem
- --collector.loadavg
- --collector.meminfo
- --collector.hwmon
- --collector.vmstat
- --collector.netdev
- --collector.processes

# Data is mounted beneath /media/martin (root:root, mode 0750).
# Keep the exporter unprivileged, but grant group traversal for statfs.
securityContext:
  fsGroup: 0
