revisionHistoryLimit: 1

resources:
  requests:
    cpu: 0.1
    memory: 16Mi
  limits:
    cpu: 0.5
    memory: 128Mi

extraArgs:
- --collector.disable-defaults
- --collector.cpu
- --collector.diskstats
- --collector.filesystem
- --collector.loadavg
- --collector.meminfo
- --collector.hwmon
- --collector.vmstat
- --collector.netdev
- --collector.processes
- --collector.textfile

- --collector.textfile.directory=/host/root/var/lib/node-exporter/textfile

securityContext:
  fsGroup: 0
