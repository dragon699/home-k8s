csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

persistence:
  defaultClassReplicaCount: 1
  defaultDataLocality: best-effort
  migratable: true

defaultSettings:
  defaultReplicaCount: 1
  logLevel: Warn
  dataEngineLogLevel: Warning
  storageReservedPercentageForDefaultDisk: 10

longhornUI:
  replicas: 1

service:
  ui:
    type: ClusterIP

defaultBackupStore:
  backupTarget: nfs://192.168.1.170:/media/martin/Data/Backups/home-k8s/Longhorn
  pollInterval: 300
