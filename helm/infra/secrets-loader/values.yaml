      provider: shared
    # Migrated to OIDC
    # auth-grafana-alloy:
    #   provider: vault
    data-grafana-alloy:
      provider: vault
    auth-grafana:
      provider: vault
    auth-grafana-image-renderer:
      provider: vault
    auth-grafana-sync-dashboards:
      provider: vault
    auth-immich:
      provider: vault
    auth-jellyfin:
      provider: vault
    auth-pihole:
      provider: vault
    auth-vesync:
      provider: vault
    auth-minio:
      provider: vault
    auth-openclaw-grafana:
      provider: vault
    auth-immich-grafana:
      provider: vault
    auth-jellyfin-grafana:
      provider: vault
    auth-tmdb-grafana:
      provider: vault

  openclaw:
    data-openclaw:
      provider: vault

  pihole:
    auth-pihole:
      provider: vault

  # Migrated to OIDC
  # qbittorrent:
  #   auth-qbittorrent:
  #     provider: vault

  radar:
    # Migrated to OIDC
    # auth-radar:
    #   provider: vault
    auth-radar-argocd:
      provider: vault

  shared:
    auth-gcloud-storage:
      provider: vault
    data-authentik-home-k8s:
      spec:
        refreshInterval: 0m0s
        target:
          name: data-authentik-home-k8s
          creationPolicy: Owner
        dataFrom:
        - sourceRef:
            generatorRef:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: Password
              name: data-authentik-home-k8s
    data-redis-shared:
      spec:
        refreshInterval: 0m0s
        target:
          name: data-redis-shared
          creationPolicy: Owner
        dataFrom:
        - sourceRef:
            generatorRef:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: Password
              name: data-redis-shared

  renovate:
    auth-github-renovate:
      provider: vault

  sparkyfitness:
    data-postgresql-shared-sparkyfitness:
      provider: shared
    postgresql-shared-pg-cluster-ca-cert:
      provider: shared
    auth-sparkyfitness:
      provider: vault

  sure:
    auth-brandfetch-sure:
      provider: vault
    auth-openclaw-sure:
      provider: vault
    data-postgresql-shared-sure:
      provider: shared
    data-redis-shared:
      spec:
        refreshInterval: 5m0s
        secretStoreRef:
          name: in-cluster-shared
          kind: ClusterSecretStore
        target:
          name: data-redis-shared
          creationPolicy: Owner
          template:
            mergePolicy: Merge
            data:
              url: "redis://:{{ .password | urlquery }}@redis-shared.shared.svc:6379/8"
        dataFrom:
        - extract:
            key: data-redis-shared
            conversionStrategy: Default
            decodingStrategy: None
            metadataPolicy: None
    data-sure:
      spec:
        refreshInterval: 0m0s
        target:
          name: data-sure
          creationPolicy: Owner
        dataFrom:
        - sourceRef:
            generatorRef:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: Password
              name: data-sure
          rewrite:
          - regexp:
              source: "^password$"
              target: SECRET_KEY_BASE
    data-sure-mcp:
      spec:
        refreshInterval: 0m0s
        target:
          name: data-sure-mcp
          creationPolicy: Owner
        dataFrom:
        - sourceRef:
            generatorRef:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: Password
              name: data-sure-mcp

  teslamate:
    data-teslamate:
      provider: vault
    # Migrated to OIDC
    # auth-teslamate:
    #   provider: vault
    data-postgresql-shared-teslamate-teslamate:
      provider: shared
    postgresql-shared-pg-cluster-ca-cert:
      provider: shared

  vault:
    data-vault-sensitive:
      provider: vault
    data-authentik-home-k8s:
      provider: shared
    auth-gcloud-storage:
      provider: vault
      path: home/shared/auth-gcloud-storage

  vikunja:
    data-postgresql-shared-vikunja:
      provider: shared
    data-authentik-home-k8s:
      provider: shared
