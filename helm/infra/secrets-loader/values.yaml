      provider: shared
    postgresql-shared-pg-cluster-ca-cert:
      provider: shared
    auth-teslamate-mcp:
      provider: vault
    auth-vault-mcp:
      provider: vault

  monitoring:
    data-authentik-home-k8s:
      provider: shared
    data-postgresql-shared-monitoring-grafana:
      provider: shared
    data-postgresql-shared-teslamate-teslamate:
      provider: shared
    data-postgresql-shared-dawarich:
      provider: shared
