injector:
  enabled: false

server:
  logLevel: info
  logFormat: json

  dataStorage:
    enabled: true
    size: 10Gi

  auditStorage:
    enabled: false

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"

          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

        disable_mlock = true

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname          = true
        }

serverTelemetry:
  serviceMonitor:
    enabled: true
    matchLabels:
      vault-internal: "true"

csi:
  enabled: false

ui:
  enabled: true
