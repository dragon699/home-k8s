revisionHistoryLimit: 1

controller:
  replicaCount: 1
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  allowSnippetAnnotations: true

  service:
    externalTrafficPolicy: Local

  config:
    use-forwarded-headers: "true"
    enable-real-ip: "true"
    enable-opentelemetry: "true"
    otlp-collector-host: grafana-alloy.monitoring.svc.cluster.local
    otlp-collector-port: "4317"
    otel-service-name: ingress-nginx
    otel-sampler: AlwaysOn
    opentelemetry-operation-name: "$request_method $host"
    log-format-upstream: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id $opentelemetry_trace_id'

  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10254"
