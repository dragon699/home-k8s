image:
  repository: ghcr.io/we-promise/sure
  tag: "0.7.5"

rails:
  existingSecret: data-sure
  encryptionEnv:
    enabled: false
  settings:
    SELF_HOSTED: "true"
    ONBOARDING_STATE: "invite_only"
    AI_DEBUG_MODE: "false"
  extraEnv:
    APP_DOMAIN: money.iaminyourpc.xyz
    PGSSLMODE: require
    MCP_USER_EMAIL: skullfighter6@gmail.com
  extraEnvVars:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: data-postgresql-shared-sure
        key: uri
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: data-redis-shared
        key: url
  - name: MCP_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: data-sure-mcp
        key: password

cnpg:
  enabled: false
  cluster:
    enabled: false

redisOperator:
  enabled: false
  managed:
    enabled: false

redisSimple:
  enabled: false

ingress:
  enabled: false

web:
  revisionHistoryLimit: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 1Gi
  extraVolumeMounts:
  - name: storage
    mountPath: /rails/storage
  - name: initializers
    mountPath: /rails/config/initializers/zz_logtail_header_filters.rb
    subPath: zz_logtail_header_filters.rb
    readOnly: true
  extraVolumes:
  - name: storage
    persistentVolumeClaim:
      claimName: sure
  - name: initializers
    configMap:
      name: config-sure-initializers

worker:
  revisionHistoryLimit: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  extraVolumeMounts:
  - name: storage
    mountPath: /rails/storage
  extraVolumes:
  - name: storage
    persistentVolumeClaim:
      claimName: sure

migrations:
  strategy: job
