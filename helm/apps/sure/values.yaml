image:
  repository: ghcr.io/we-promise/sure
  tag: "0.7.6"

rails:
  existingSecret: data-sure
  encryptionEnv:
    enabled: false
  settings:
    SELF_HOSTED: "true"
    ONBOARDING_STATE: "invite_only"
    AI_DEBUG_MODE: "false"
  extraEnv:
    APP_DOMAIN: money.iaminyourpc.xyz
    PGSSLMODE: require
    MCP_USER_EMAIL: skullfighter6@gmail.com
    ASSISTANT_TYPE: external
    EXTERNAL_ASSISTANT_URL: http://openclaw-main.openclaw.svc:18789/v1/chat/completions
    EXTERNAL_ASSISTANT_MODEL: openclaw/money-tracker
    EXTERNAL_ASSISTANT_ALLOWED_EMAILS: skullfighter6@gmail.com
    LLM_CONTEXT_WINDOW: "180000"
    LLM_MAX_ITEMS_PER_CALL: "100"
    LLM_JSON_MODE: none
    OPENAI_REQUEST_TIMEOUT: "120"
    OPENAI_URI_BASE: http://openclaw-main.openclaw.svc:18789/v1
    OPENAI_MODEL: openclaw/sure-worker
  extraEnvVars:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: data-postgresql-shared-sure
        key: uri
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: data-redis-shared
        key: url
  - name: MCP_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: data-sure-mcp
        key: password
  - name: EXTERNAL_ASSISTANT_TOKEN
    valueFrom:
      secretKeyRef:
        name: auth-openclaw-sure
        key: OPENCLAW_GATEWAY_TOKEN
  - name: OPENAI_ACCESS_TOKEN
    valueFrom:
      secretKeyRef:
        name: auth-openclaw-sure
        key: OPENCLAW_GATEWAY_TOKEN
  - name: BRAND_FETCH_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: auth-brandfetch-sure
        key: BRAND_FETCH_CLIENT_ID

cnpg:
  enabled: false
  cluster:
    enabled: false

redisOperator:
  enabled: false
  managed:
    enabled: false

redisSimple:
  enabled: false

ingress:
  enabled: false

web:
  revisionHistoryLimit: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 1Gi
  extraVolumeMounts:
  - name: storage
    mountPath: /rails/storage
  - name: initializers
    mountPath: /rails/config/initializers/zz_logtail_header_filters.rb
    subPath: zz_logtail_header_filters.rb
    readOnly: true
  - name: initializers
    mountPath: /rails/config/initializers/zz_openai_json_object_hint.rb
    subPath: zz_openai_json_object_hint.rb
    readOnly: true
  extraVolumes:
  - name: storage
    persistentVolumeClaim:
      claimName: sure
  - name: initializers
    configMap:
      name: config-sure-initializers

worker:
  revisionHistoryLimit: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  extraVolumeMounts:
  - name: storage
    mountPath: /rails/storage
  - name: initializers
    mountPath: /rails/config/initializers/zz_openai_json_object_hint.rb
    subPath: zz_openai_json_object_hint.rb
    readOnly: true
  extraVolumes:
  - name: storage
    persistentVolumeClaim:
      claimName: sure
  - name: initializers
    configMap:
      name: config-sure-initializers

migrations:
  strategy: job
