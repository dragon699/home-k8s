image: skullfighter6/percona-postgresql-vectorchord:18.1-3-vchord0.5.3
postgresVersion: 18

extensions:
  builtin:
    pgvector: true

patroni:
  dynamicConfiguration:
    postgresql:
      parameters:
        shared_preload_libraries: "pg_stat_monitor,pgaudit,vchord.so"

backups:
  enabled: false

proxy:
  pgBouncer:
    replicas: 1
    config:
      global:
        client_tls_sslmode: allow

instances:
- name: shared
  replicas: 1
  dataVolumeClaimSpec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    annotations:
      helm.sh/resource-policy: keep

users:
- name: immich
  secretName: data-postgresql-shared-immich
  databases:
  - immich
  options: "SUPERUSER"

- name: teslamate-teslamate
  secretName: data-postgresql-shared-teslamate-teslamate
  databases:
  - teslamate-teslamate
  options: "SUPERUSER"

- name: monitoring-grafana
  secretName: data-postgresql-shared-monitoring-grafana
  databases:
  - monitoring-grafana
  options: "SUPERUSER"

- name: vikunja
  secretName: data-postgresql-shared-vikunja
  databases:
  - vikunja
  options: "SUPERUSER"
