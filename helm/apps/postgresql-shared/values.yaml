image: perconalab/percona-postgresql-operator:main-ppg18-postgres
postgresVersion: 18

backups:
  enabled: false

proxy:
  pgBouncer:
    replicas: 1
    config:
      global:
        client_tls_sslmode: allow

instances:
- name: shared
  replicas: 1
  dataVolumeClaimSpec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    annotations:
      helm.sh/resource-policy: keep

users:
- name: teslamate-teslamate
  secretName: data-postgresql-shared-teslamate-teslamate
  databases:
  - teslamate-teslamate
  options: "SUPERUSER"

- name: monitoring-grafana
  secretName: data-postgresql-shared-monitoring-grafana
  databases:
  - monitoring-grafana
  options: "SUPERUSER"

- name: vikunja
  secretName: data-postgresql-shared-vikunja
  databases:
  - vikunja
  options: "SUPERUSER"
