app-template:
  openclawVersion: "2026.9.8"
  chromiumVersion: "155.0.8059.26"
  configMode: merge

  service:
    twilio:
      controller: main
      ports:
        http:
          port: 3334

  controllers:
    main:
      initContainers:
        init-skills:
          command:
          - sh
          - -c
          - |
            SKILLS="weather gog mcporter goplaces gh ffmpeg peekaboo upwork-hunting"

            log() { echo "[$(date -Iseconds)] [init-skills] $*"; }

            log "Starting skills initialization"

            mkdir -p /home/node/.openclaw/workspace/skills
            cd /home/node/.openclaw/workspace
            install_skill() {
              skill="$1"
              SKILL_NAME="$(basename "$skill")"
              if [ -z "$skill" ]; then
                return 0
              fi
              if [ -d "skills/$SKILL_NAME" ]; then
                log "Skill already installed: $skill"
                return 0
              fi
              log "Installing skill: $skill"
              attempts=6
              delay=5
              for i in $(seq 1 "$attempts"); do
                if npx -y clawhub install "$skill" --no-input; then
                  log "Installed skill: $skill"
                  return 0
                fi
                jitter=$((RANDOM % 5))
                if [ "$i" -lt "$attempts" ]; then
                  log "WARNING: Failed to install skill: $skill (attempt $i/$attempts). Retrying in $((delay + jitter))s..."
                  sleep $((delay + jitter))
                  delay=$((delay * 2))
                fi
              done
              log "WARNING: Failed to install skill after $attempts attempts: $skill"
              return 1
            }

            for skill in $SKILLS; do
              install_skill "$skill" || true
            done
            log "Skills initialization complete"
      containers:
        chromium:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 6000m
              memory: 4Gi
        main:
          ports:
          - name: twilio
            containerPort: 3334
            protocol: TCP
          envFrom:
            - secretRef:
                name: data-openclaw
          securityContext:
            readOnlyRootFilesystem: false

  configMaps:
    config:
      enabled: true
      data:
        bash_aliases: |
          alias openclaw='node /app/dist/index.js'
        openclaw.json: |
          {
            "gateway": {
              "mode": "local",
              "port": 18789,
              "bind": "lan",
              "auth": {
                "mode": "token",
                "token": "${OPENCLAW_GATEWAY_TOKEN}"
              },
              "controlUi": {
                "allowedOrigins": ["https://stitch.iaminyourpc.xyz"]
              }
            }
          }
