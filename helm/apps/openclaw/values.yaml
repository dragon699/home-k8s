app-template:
  configMode: overwrite

  service:
    twilio:
      controller: main
      ports:
        http:
          port: 3334

  controllers:
    main:
      initContainers:
        init-skills:
          command:
          - sh
          - -c
          - |
            SKILLS="weather gog mcporter goplaces gh ffmpeg"

            log() { echo "[$(date -Iseconds)] [init-skills] $*"; }

            log "Starting skills initialization"

            mkdir -p /home/node/.openclaw/workspace/skills
            cd /home/node/.openclaw/workspace
            install_skill() {
              skill="$1"
              SKILL_NAME="$(basename "$skill")"
              if [ -z "$skill" ]; then
                return 0
              fi
              if [ -d "skills/$SKILL_NAME" ]; then
                log "Skill already installed: $skill"
                return 0
              fi
              log "Installing skill: $skill"
              attempts=6
              delay=5
              for i in $(seq 1 "$attempts"); do
                if npx -y clawhub install "$skill" --no-input; then
                  log "Installed skill: $skill"
                  return 0
                fi
                jitter=$((RANDOM % 5))
                if [ "$i" -lt "$attempts" ]; then
                  log "WARNING: Failed to install skill: $skill (attempt $i/$attempts). Retrying in $((delay + jitter))s..."
                  sleep $((delay + jitter))
                  delay=$((delay * 2))
                fi
              done
              log "WARNING: Failed to install skill after $attempts attempts: $skill"
              return 1
            }

            for skill in $SKILLS; do
              install_skill "$skill" || true
            done
            log "Skills initialization complete"
      containers:
        main:
          ports:
          - name: twilio
            containerPort: 3334
            protocol: TCP
          envFrom:
            - secretRef:
                name: data-openclaw
          securityContext:
            readOnlyRootFilesystem: false

  configMaps:
    config:
      enabled: true
      data:
        bash_aliases: |
          alias openclaw='node /app/dist/index.js'
        openclaw.json: |
          {
            "plugins": {
              "entries": {
                "mcp-bridge": {
                  "config": {
                    "autoDiscover": true,
                    "mode": "traditional"
                  },
                  "enabled": true
                },
                "openclaw-web-search": {
                  "enabled": true
                },
                "telegram": {
                  "enabled": true
                },
                "voice-call": {
                  "enabled": true,
                  "config": {
                    "provider": "twilio",
                    "twilio": {
                      "accountSid": "${TWILIO_ACCOUNT_SID}",
                      "authToken": "${TWILIO_AUTH_TOKEN}"
                    },
                    "fromNumber": "${TWILIO_FROM_NUMBER}",
                    "toNumber": "${TWILIO_TO_NUMBER}",
                    "publicUrl": "${TWILIO_PUBLIC_URL}",
                    "serve": {
                      "bind": "0.0.0.0"
                    },
                    "inboundPolicy": "allowlist",
                    "allowFrom": ["+359879000301"],
                    "inboundGreeting": "Hello! I'm Stitch and i like to make compilations of Dankata.",
                    "streaming": {
                      "enabled": true,
                      "streamPath": "/voice/stream"
                    },
                    "responseModel": "openai/gpt-4o-mini",
                    "responseTimeoutMs": 60000
                  }
                }
              }
            },
            "agents": {
              "defaults": {
                "compaction": {
                  "mode": "safeguard"
                },
                "maxConcurrent": 4,
                "model": {
                  "primary": "ollama/minimax-m2.5:cloud"
                },
                "subagents": {
                  "maxConcurrent": 8
                },
                "workspace": "/home/node/.openclaw/workspace"
              }
            },
            "channels": {
              "slack": {
                "allowFrom": ["*"],
                "appToken": "${SLACK_APP_TOKEN}",
                "botToken": "${SLACK_BOT_TOKEN}",
                "dmPolicy": "open",
                "enabled": true,
                "groupPolicy": "allowlist",
                "mode": "socket",
                "nativeStreaming": true,
                "streaming": "partial",
                "userTokenReadOnly": true,
                "webhookPath": "/slack/events"
              },
              "telegram": {
                "botToken": "${TELEGRAM_BOT_TOKEN}",
                "dmPolicy": "pairing",
                "enabled": true,
                "groupPolicy": "allowlist",
                "streaming": "partial"
              }
            },
            "commands": {
              "native": "auto",
              "nativeSkills": "auto",
              "ownerDisplay": "raw",
              "restart": true
            },
            "gateway": {
              "auth": {
                "mode": "token",
                "token": "${OPENCLAW_GATEWAY_TOKEN}"
              },
              "bind": "lan",
              "controlUi": {
                "dangerouslyAllowHostHeaderOriginFallback": true
              },
              "mode": "local",
              "nodes": {
                "denyCommands": []
              },
              "port": 18789,
              "tailscale": {
                "mode": "off",
                "resetOnExit": false
              },
              "trustedProxies": [],
              "http": {
                "endpoints": {
                  "chatCompletions": {
                    "enabled": true
                  }
                }
              }
            },
            "memory": {
              "backend": "builtin"
            },
            "messages": {
              "ackReactionScope": "group-mentions",
              "tts": {
                "provider": "openai",
                "openai": {
                  "apiKey": "${OPENAI_API_KEY}",
                  "voice": "alloy"
                }
              }
            },
            "models": {
              "providers": {
                "ollama": {
                  "api": "ollama",
                  "apiKey": "ollama-local",
                  "baseUrl": "http://${OLLAMA_HOST}:${OLLAMA_PORT}/v1",
                  "models": [
                    {
                      "contextWindow": 204800,
                      "cost": {
                        "cacheRead": 0,
                        "cacheWrite": 0,
                        "input": 0,
                        "output": 0
                      },
                      "id": "minimax-m2.5:cloud",
                      "input": ["text"],
                      "maxTokens": 128000,
                      "name": "minimax-m2.5:cloud",
                      "reasoning": true
                    }
                  ]
                },
                "openai": {
                  "api": "openai-completions",
                  "apiKey": "${OPENAI_API_KEY}",
                  "baseUrl": "https://api.openai.com/v1",
                  "models": [
                    {
                      "id": "gpt-4o",
                      "name": "GPT-4o",
                      "input": ["text", "image"],
                      "maxTokens": 16384,
                      "contextWindow": 128000,
                      "cost": {
                        "input": 2.5,
                        "output": 10,
                        "cacheRead": 1.25,
                        "cacheWrite": 10
                      }
                    },
                    {
                      "id": "gpt-5",
                      "name": "GPT-5",
                      "input": ["text", "image"],
                      "maxTokens": 128000,
                      "contextWindow": 400000,
                      "cost": {
                        "input": 1.25,
                        "output": 10,
                        "cacheRead": 0.125,
                        "cacheWrite": 10
                      }
                    },
                    {
                      "id": "gpt-4o-mini",
                      "name": "GPT-4o Mini",
                      "input": ["text", "image"],
                      "maxTokens": 16384,
                      "contextWindow": 128000,
                      "cost": {
                        "input": 0.15,
                        "output": 0.6,
                        "cacheRead": 0.075,
                        "cacheWrite": 0.3
                      }
                    }
                  ]
                }
              }
            },
            "session": {
              "dmScope": "per-channel-peer"
            },
            "tools": {
              "profile": "full",
              "web": {
                "search": {
                  "enabled": true
                }
              }
            },
            "web": {
              "enabled": true
            }
          }
