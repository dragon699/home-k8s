app-template:
  openclawVersion: "2026.9.8"
  configMode: merge

  service:
    mcp-apps:
      controller: main
      ports:
        http:
          port: 18790

  controllers:
    main:
      revisionHistoryLimit: 1
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        # The gateway can take >30s to release its state lease; a SIGKILL leaves a stale lease that blocks the next pod for minutes
        terminationGracePeriodSeconds: 120
      initContainers:
        fix-permissions:
          image:
            repository: ghcr.io/openclaw/openclaw
            tag: "{{ .Values.openclawVersion }}"
          command:
          - sh
          - -c
          - chown 1000:1000 /home/node/.openclaw && chmod 1777 /tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
              add:
              - CHOWN
        init-skills:
          command:
          - sh
          - -c
          - |
            SKILLS="@steipete/weather @steipete/gog @steipete/mcporter @steipete/goplaces gh ffmpeg @steipete/peekaboo upwork-hunting"

            log() { echo "[$(date -Iseconds)] [init-skills] $*"; }

            log "Starting skills initialization"

            mkdir -p /home/node/.openclaw/workspace/skills
            cd /home/node/.openclaw/workspace
            install_skill() {
              skill="$1"
              if [ -z "$skill" ]; then
                return 0
              fi
              if [ -d "skills/$skill" ]; then
                log "Skill already installed: $skill"
                return 0
              fi
              log "Installing skill: $skill"
              attempts=6
              delay=5
              for i in $(seq 1 "$attempts"); do
                if npx -y clawhub install "$skill" --no-input; then
                  log "Installed skill: $skill"
                  return 0
                fi
                jitter=$((RANDOM % 5))
                if [ "$i" -lt "$attempts" ]; then
                  log "WARNING: Failed to install skill: $skill (attempt $i/$attempts). Retrying in $((delay + jitter))s..."
                  sleep $((delay + jitter))
                  delay=$((delay * 2))
                fi
              done
              log "WARNING: Failed to install skill after $attempts attempts: $skill"
              return 1
            }

            for skill in $SKILLS; do
              install_skill "$skill" || true
            done
            log "Skills initialization complete"
      containers:
        chromium:
          enabled: false
        main:
          resources:
            requests:
              cpu: 200m
              memory: 6Gi
            limits:
              cpu: 2000m
              memory: 6Gi
          ports:
          - name: mcp-apps
            containerPort: 18790
            protocol: TCP
          envFrom:
            - secretRef:
                name: data-openclaw
          securityContext:
            readOnlyRootFilesystem: false

  persistence:
    data:
      advancedMounts:
        main:
          fix-permissions:
          - path: /home/node/.openclaw
    tmp:
      advancedMounts:
        main:
          fix-permissions:
          - path: /tmp

  configMaps:
    config:
      enabled: true
      data:
        bash_aliases: |
          alias openclaw='node /app/dist/index.js'
        # This config merges with the one already present in the OpenClaw container (PVC)
        openclaw.json: |
          {
            "gateway": {
              "mode": "local",
              "port": 18789,
              "bind": "lan",
              "http": {
                "endpoints": {
                  "chatCompletions": {
                    "enabled": true
                  },
                  "responses": {
                    "enabled": true
                  }
                }
              },
              "trustedProxies": ["192.168.1.170"],
              "auth": {
                "mode": "token",
                "token": "${OPENCLAW_GATEWAY_TOKEN}"
              },
              "controlUi": {
                "allowedOrigins": ["https://stitch.iaminyourpc.xyz"]
              },
              "nodes": {
                "commands": {
                  "allow": [
                    "camera.snap",
                    "camera.clip",
                    "camera.ptz.control",
                    "screen.record",
                    "contacts.add",
                    "calendar.add",
                    "reminders.add",
                    "health.summary",
                    "sms.send",
                    "sms.search"
                  ]
                }
              }
            },
            "mcp": {
              "apps": {
                "enabled": true,
                "sandboxOrigin": "https://apps.stitch.iaminyourpc.xyz",
                "sandboxPort": 18790
              }
            },
            "browser": {
              "enabled": false
            },
            "plugins": {
              "entries": {
                "browser": {
                  "enabled": false
                },
                "diagnostics-otel": {
                  "enabled": true
                }
              }
            },
            "diagnostics": {
              "otel": {
                "enabled": true,
                "endpoint": "http://grafana-alloy.monitoring.svc:4318",
                "protocol": "http/protobuf",
                "serviceName": "openclaw",
                "traces": true,
                "metrics": true,
                "logs": false,
                "sampleRate": 1.0,
                "flushIntervalMs": 5000,
                "captureContent": false
              }
            },
            "memory": {
              "search": {
                "provider": "openai-compatible",
                "model": "embeddinggemma-300m",
                "remote": {
                  "baseUrl": "http://openclaw-embeddings.openclaw.svc:8080/v1/",
                  "apiKey": "local"
                }
              }
            }
          }
