app-template:
  openclawVersion: "2026.9.8"
  configMode: merge

  service:
    mcp-apps:
      controller: main
      ports:
        http:
          port: 18790

  controllers:
    main:
      revisionHistoryLimit: 1
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        terminationGracePeriodSeconds: 120
      initContainers:
        fix-permissions:
          image:
            repository: ghcr.io/openclaw/openclaw
            tag: "{{ .Values.openclawVersion }}"
          command:
          - sh
          - -c
          - chown 1000:1000 /home/node/.openclaw && chmod 1777 /tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
              add:
              - CHOWN
        init-skills:
          envFrom:
            - secretRef:
                name: data-openclaw
          command:
          - sh
          - -c
          - |
            SKILLS="@steipete/weather @steipete/mcporter @steipete/goplaces gh @steipete/peekaboo upwork-hunting"
            SHARED_SKILLS="ffmpeg @steipete/gog"
            TOOLS=/home/node/.openclaw/tools
            SUMMARIZE_VERSION="0.25.2"
            GOG_VERSION="0.44.0"
            GOG_SHA256="9e40b7e51be9162e5ab92d255376257e4d594e9e64dc360fffccd85ba4e1c0c0"
            FFMPEG_RELEASE="autobuild-2026-10-13-13-05"
            FFMPEG_FILE="ffmpeg-n9.0.2-27-g7e93014c5b-linux64-gpl-9.0.tar.xz"
            FFMPEG_SHA256="50e0ede136e3545758a8dfb2e6cd12ec865643cd138af9ce6cd36a9015f395c2"

            log() { echo "[$(date -Iseconds)] [init-skills] $*"; }

            log "Starting skills initialization"

            mkdir -p /home/node/.openclaw/workspace/skills /home/node/.openclaw/skills "$TOOLS/bin"
            install_skill() {
              base="$1"
              skill="$2"
              if [ -z "$skill" ]; then
                return 0
              fi
              if [ -d "$base/skills/$skill" ]; then
                log "Skill already installed: $skill ($base)"
                return 0
              fi
              log "Installing skill: $skill ($base)"
              attempts=6
              delay=5
              for i in $(seq 1 "$attempts"); do
                if (cd "$base" && npx -y clawhub install "$skill" --no-input); then
                  log "Installed skill: $skill"
                  return 0
                fi
                jitter=$((RANDOM % 5))
                if [ "$i" -lt "$attempts" ]; then
                  log "WARNING: Failed to install skill: $skill (attempt $i/$attempts). Retrying in $((delay + jitter))s..."
                  sleep $((delay + jitter))
                  delay=$((delay * 2))
                fi
              done
              log "WARNING: Failed to install skill after $attempts attempts: $skill"
              return 1
            }

            for skill in $SKILLS; do
              install_skill /home/node/.openclaw/workspace "$skill" || true
            done
            for skill in $SHARED_SKILLS; do
              install_skill /home/node/.openclaw "$skill" && rm -rf "/home/node/.openclaw/workspace/skills/$skill" || true
            done

            fetch() {
              curl -fsSL --retry 5 -o "$3" "$1" && echo "$2  $3" | sha256sum -c - >/dev/null
            }
            installed() { [ "$(cat "$TOOLS/.$1-version" 2>/dev/null)" = "$2" ] && [ -x "$TOOLS/bin/$1" ]; }

            if installed gog "$GOG_VERSION"; then
              log "Tool already installed: gog $GOG_VERSION"
            elif fetch "https://github.com/openclaw/gogcli/releases/download/v$GOG_VERSION/gogcli_${GOG_VERSION}_linux_amd64.tar.gz" "$GOG_SHA256" /tmp/gog.tgz \
              && tar -xzf /tmp/gog.tgz -C "$TOOLS/bin" ./gog && echo "$GOG_VERSION" > "$TOOLS/.gog-version"; then
              log "Installed tool: gog $GOG_VERSION"
            else
              log "WARNING: Failed to install gog $GOG_VERSION"
            fi
            rm -f /tmp/gog.tgz

            if installed ffmpeg "$FFMPEG_FILE"; then
              log "Tool already installed: ffmpeg"
            elif fetch "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_FILE" "$FFMPEG_SHA256" /tmp/ffmpeg.tar.xz \
              && python3 -c 'import sys, tarfile, shutil, os
            t = tarfile.open(sys.argv[1], "r:xz")
            for m in t.getmembers():
                name = os.path.basename(m.name)
                if m.isfile() and os.path.basename(os.path.dirname(m.name)) == "bin" and name in ("ffmpeg", "ffprobe"):
                    dst = os.path.join(sys.argv[2], name)
                    with t.extractfile(m) as src, open(dst + ".tmp", "wb") as out:
                        shutil.copyfileobj(src, out)
                    os.chmod(dst + ".tmp", 0o755)
                    os.replace(dst + ".tmp", dst)' /tmp/ffmpeg.tar.xz "$TOOLS/bin" \
              && echo "$FFMPEG_FILE" > "$TOOLS/.ffmpeg-version"; then
              log "Installed tool: ffmpeg"
            else
              log "WARNING: Failed to install ffmpeg"
            fi
            rm -f /tmp/ffmpeg.tar.xz

            if installed summarize "$SUMMARIZE_VERSION"; then
              log "Tool already installed: summarize $SUMMARIZE_VERSION"
            elif npm install -g --prefix "$TOOLS/summarize" --cache /tmp/npm-cache --no-audit --no-fund "@steipete/summarize@$SUMMARIZE_VERSION" \
              && ln -sf "$TOOLS/summarize/bin/summarize" "$TOOLS/bin/summarize" && echo "$SUMMARIZE_VERSION" > "$TOOLS/.summarize-version"; then
              log "Installed tool: summarize $SUMMARIZE_VERSION"
            else
              log "WARNING: Failed to install summarize $SUMMARIZE_VERSION"
            fi
            rm -rf /tmp/npm-cache

            log "Skills initialization complete"

            PLUGINS="@expediagroup/expedia-openclaw@1.0.4:expedia-openclaw"
            for entry in $PLUGINS; do
              spec="${entry%:*}"; id="${entry##*:}"
              want="${spec##*@}"
              have="$(node -p "require('/home/node/.openclaw/extensions/$id/package.json').version" 2>/dev/null || true)"
              if [ "$have" = "$want" ]; then
                log "Plugin already installed: $id $have"
              elif [ -n "$have" ]; then
                node /app/dist/index.js plugins update "$id@$want" --accept-capabilities && log "Updated plugin: $id $have -> $want" || log "WARNING: Failed to update plugin: $id"
              else
                node /app/dist/index.js plugins install "clawhub:$spec" --no-enable --accept-capabilities && log "Installed plugin: $id $want" || log "WARNING: Failed to install plugin: $id"
              fi
            done
      containers:
        chromium:
          enabled: false
        main:
          resources:
            requests:
              cpu: 200m
              memory: 6Gi
            limits:
              cpu: 2000m
              memory: 6Gi
          ports:
          - name: mcp-apps
            containerPort: 18790
            protocol: TCP
          envFrom:
            - secretRef:
                name: data-openclaw
          env:
            PATH: /home/node/.openclaw/tools/bin:/home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          securityContext:
            readOnlyRootFilesystem: false

  persistence:
    data:
      advancedMounts:
        main:
          fix-permissions:
          - path: /home/node/.openclaw
    tmp:
      advancedMounts:
        main:
          fix-permissions:
          - path: /tmp

  configMaps:
    config:
      enabled: true
      data:
        bash_aliases: |
          alias openclaw='node /app/dist/index.js'
        # This config merges with the one already present in the OpenClaw container (PVC)
        openclaw.json: |
          {
            "gateway": {
              "mode": "local",
              "port": 18789,
              "bind": "lan",
              "http": {
                "endpoints": {
                  "chatCompletions": {
                    "enabled": true
                  },
                  "responses": {
                    "enabled": true
                  }
                }
              },
              "trustedProxies": ["192.168.1.170"],
              "auth": {
                "mode": "token",
                "token": "${OPENCLAW_GATEWAY_TOKEN}"
              },
              "controlUi": {
                "allowedOrigins": ["https://stitch.iaminyourpc.xyz"]
              },
              "nodes": {
                "commands": {
                  "allow": [
                    "camera.snap",
                    "camera.clip",
                    "camera.ptz.control",
                    "screen.record",
                    "contacts.add",
                    "calendar.add",
                    "reminders.add",
                    "health.summary",
                    "sms.send",
                    "sms.search"
                  ]
                }
              }
            },
            "mcp": {
              "sessionIdleTtlMs": 600000,
              "apps": {
                "enabled": true,
                "sandboxOrigin": "https://apps.stitch.iaminyourpc.xyz",
                "sandboxPort": 18790
              }
            },
            "browser": {
              "enabled": false
            },
            "plugins": {
              "entries": {
                "browser": {
                  "enabled": false
                },
                "diagnostics-otel": {
                  "enabled": true
                },
                "expedia-openclaw": {
                  "enabled": true,
                  "config": {
                    "default_pos_country": "BG",
                    "default_currency": "EUR"
                  }
                }
              }
            },
            "tools": {
              "alsoAllow": ["search_stays", "search_flights", "eg_travel_signup", "eg_travel_verify"]
            },
            "diagnostics": {
              "otel": {
                "enabled": true,
                "endpoint": "http://grafana-alloy.monitoring.svc:4318",
                "protocol": "http/protobuf",
                "serviceName": "openclaw",
                "traces": true,
                "metrics": true,
                "logs": false,
                "sampleRate": 1.0,
                "flushIntervalMs": 5000,
                "captureContent": true
              }
            },
            "memory": {
              "search": {
                "provider": "openai-compatible",
                "model": "embeddinggemma-300m",
                "remote": {
                  "baseUrl": "http://openclaw-embeddings.openclaw.svc:8080/v1/",
                  "apiKey": "local"
                }
              }
            }
          }
