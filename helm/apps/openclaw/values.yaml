app-template:
  openclawVersion: "2026.9.8"
  chromiumVersion: "155.0.8059.26"
  configMode: merge

  service:
    twilio:
      controller: main
      ports:
        http:
          port: 3334

  controllers:
    main:
      initContainers:
        fix-permissions:
          image:
            repository: ghcr.io/openclaw/openclaw
            tag: "{{ .Values.openclawVersion }}"
          command:
          - sh
          - -c
          - chown 1000:1000 /home/node/.openclaw
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
              add:
              - CHOWN
        init-skills:
          command:
          - sh
          - -c
          - |
            SKILLS="@steipete/weather @steipete/gog @steipete/mcporter @steipete/goplaces gh ffmpeg @steipete/peekaboo upwork-hunting"

            log() { echo "[$(date -Iseconds)] [init-skills] $*"; }

            log "Starting skills initialization"

            mkdir -p /home/node/.openclaw/workspace/skills
            cd /home/node/.openclaw/workspace
            install_skill() {
              skill="$1"
              if [ -z "$skill" ]; then
                return 0
              fi
              if [ -d "skills/$skill" ]; then
                log "Skill already installed: $skill"
                return 0
              fi
              log "Installing skill: $skill"
              attempts=6
              delay=5
              for i in $(seq 1 "$attempts"); do
                if npx -y clawhub install "$skill" --no-input; then
                  log "Installed skill: $skill"
                  return 0
                fi
                jitter=$((RANDOM % 5))
                if [ "$i" -lt "$attempts" ]; then
                  log "WARNING: Failed to install skill: $skill (attempt $i/$attempts). Retrying in $((delay + jitter))s..."
                  sleep $((delay + jitter))
                  delay=$((delay * 2))
                fi
              done
              log "WARNING: Failed to install skill after $attempts attempts: $skill"
              return 1
            }

            for skill in $SKILLS; do
              install_skill "$skill" || true
            done
            log "Skills initialization complete"
      containers:
        chromium:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 6000m
              memory: 4Gi
        main:
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          ports:
          - name: twilio
            containerPort: 3334
            protocol: TCP
          envFrom:
            - secretRef:
                name: data-openclaw
          securityContext:
            readOnlyRootFilesystem: false

  persistence:
    data:
      advancedMounts:
        main:
          fix-permissions:
          - path: /home/node/.openclaw

  configMaps:
    config:
      enabled: true
      data:
        bash_aliases: |
          alias openclaw='node /app/dist/index.js'
        openclaw.json: |
          {
            "gateway": {
              "mode": "local",
              "port": 18789,
              "bind": "lan",
              "trustedProxies": ["192.168.1.170"],
              "auth": {
                "mode": "token",
                "token": "${OPENCLAW_GATEWAY_TOKEN}"
              },
              "controlUi": {
                "allowedOrigins": ["https://stitch.iaminyourpc.xyz"]
              },
              "nodes": {
                "commands": {
                  "allow": [
                    "camera.snap",
                    "camera.clip",
                    "camera.ptz.control",
                    "screen.record",
                    "contacts.add",
                    "calendar.add",
                    "reminders.add",
                    "health.summary",
                    "sms.send",
                    "sms.search"
                  ]
                }
              }
            }
          }
