global:
  createDefaultServiceAccount: false

defaultPodOptions:
  automountServiceAccountToken: true
  enableServiceLinks: true

controllers:
  krakend:
    annotations:
      reloader.stakater.com/auto: "true"
    replicas: 1
    revisionHistoryLimit: 1
    containers:
      krakend:
        image:
          repository: krakend
          tag: 2.12.0
          pullPolicy: IfNotPresent
        command: ['/usr/bin/krakend']
        args: ['run', '-d', '-c', '/etc/krakend/krakend.json', '-p', '8080']
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        env:
          KRAKEND_PORT: "8080"

service:
  krakend:
    controller: krakend
    ports:
      krakend:
        port: 8080

ingress:
  krakend:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-home
      kubernetes.io/ingress.class: nginx                  # home, # Dankata, # Marina/Zhelezhnitsa
      nginx.ingress.kubernetes.io/whitelist-source-range: "10.8.0.0/24,92.247.208.224/32,87.243.107.94/32,151.237.55.238/32"
    hosts:
    - host: api.k8s.iaminyourpc.xyz
      paths:
      - path: /
        pathType: Prefix
        service:
          identifier: krakend
          port: 8080
    tls:
    - hosts:
      - api.k8s.iaminyourpc.xyz
      secretName: tls-api-k8s-iaminyourpc-xyz

persistence:
  config-krakend:
    type: configMap
    name: config-krakend
    globalMounts:
    - path: /etc/krakend/krakend.json
      subPath: krakend.json
      readOnly: true
