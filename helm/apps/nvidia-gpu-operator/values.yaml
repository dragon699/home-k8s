operator:
  defaultRuntime: containerd

# Use the NVIDIA drivers installed on the host.
driver:
  enabled: false

devicePlugin:
  config:
    create: true
    name: gpu-slices
    default: any
    data:
      any: |-
        version: v1
        sharing:
          timeSlicing:
            resources:
            - name: nvidia.com/gpu
              replicas: 2

toolkit:
  env:
  - name: CONTAINERD_CONFIG
    value: /etc/k0s/containerd.d/nvidia.toml
  - name: CONTAINERD_SOCKET
    value: /run/k0s/containerd.sock
  - name: CONTAINERD_RUNTIME_CLASS
    value: nvidia
  - name: RUNTIME_CONFIG_SOURCE
    value: file=/run/k0s/containerd-cri.toml

node-feature-discovery:
  master:
    revisionHistoryLimit: 1
  worker:
    revisionHistoryLimit: 1
  gc:
    revisionHistoryLimit: 1
  topologyUpdater:
    revisionHistoryLimit: 1
