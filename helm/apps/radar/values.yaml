auth:
  mode: none

mcp:
  enabled: true

rbac:
  helm: true
  secrets: true
  viewRBAC: true
  viewWebhooks: true
  viewNodeRuntime: true
  podExec: true
  podLogs: true
  portForward: true
  additionalRules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]

timeline:
  storage: sqlite
  retention: 168h

persistence:
  enabled: true
  storageClassName: longhorn
  size: 1Gi

argocd:
  url: http://argocd-server.argocd.svc
  existingSecret: auth-radar-argocd
  existingSecretKey: token

traffic:
  prometheusUrl: http://victoriametrics-vmselect.monitoring.svc:8481/select/0/prometheus
  beylaJobSelector: job="beyla"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 1Gi
