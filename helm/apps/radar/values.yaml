# Auth is handled by ingress-nginx basic auth + IP whitelist (see manifests/apps/radar)
auth:
  mode: none

rbac:
  podExec: true
  secrets: true
  viewRBAC: true
  viewWebhooks: true

traffic:
  prometheusUrl: http://victoriametrics-vmselect.monitoring.svc:8481/select/0/prometheus
  # Set by the radar_beyla scrape in grafana-alloy
  beylaJobSelector: job="beyla"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 1Gi
