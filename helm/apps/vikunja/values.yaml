vikunja:
  image:
    tag: "2.1.0"

  controller:
    revisionHistoryLimit: 1
    annotations:
      reloader.stakater.com/auto: "true"

  ingress:
    main:
      enabled: false

  persistence:
    cache:
      enabled: true
      type: emptyDir
      mountPath: /.cache

  configMaps:
    config:
      enabled: true
      data:
        config.yml: |
          service:
            publicurl: "https://board.iaminyourpc.xyz"
          typesense:
            url: "http://vikunja-typesense:8108"
            apiKey: "typesense"
          auth:
            openid:
              enabled: true
              providers:
                authentik:
                  name: Authentik
                  authurl: "https://auth.k8s.iaminyourpc.xyz/application/o/home-k8s/"
                  clientid: home-k8s
                  scope: "openid profile email"

  env:
    VIKUNJA_DATABASE_TYPE: postgres
    VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET:
      valueFrom:
        secretKeyRef:
          name: data-authentik-home-k8s
          key: password
    VIKUNJA_DATABASE_HOST:
      valueFrom:
        secretKeyRef:
          name: data-postgresql-shared-vikunja
          key: pgbouncer-host
    VIKUNJA_DATABASE_PORT:
      valueFrom:
        secretKeyRef:
          name: data-postgresql-shared-vikunja
          key: pgbouncer-port
    VIKUNJA_DATABASE_USER:
      valueFrom:
        secretKeyRef:
          name: data-postgresql-shared-vikunja
          key: user
    VIKUNJA_DATABASE_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: data-postgresql-shared-vikunja
          key: password
    VIKUNJA_DATABASE_NAME:
      valueFrom:
        secretKeyRef:
          name: data-postgresql-shared-vikunja
          key: dbname

postgresql:
  enabled: false
