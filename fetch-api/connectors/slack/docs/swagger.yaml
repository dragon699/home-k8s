    post:
      consumes:
      - application/json
      description: Accepts a downloader-originated Slack payload and posts it to Slack.
      parameters:
      - description: Downloader Slack payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/connector-slack_internal_http_dto_request.DownloaderSlackPayload'
