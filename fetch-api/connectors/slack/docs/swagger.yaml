info:
  contact: {}
  description: A connector that sends notification messages in Slack channels.
  title: Slack Connector
paths:
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.HealthResponse'
      summary: Health check
      tags:
      - health
  /api/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.ReadyResponse'
      summary: Readiness check
      tags:
      - health
  /notifications:
    post:
      consumes:
      - application/json
      description: Send a custom notification to Slack with specified options.
      parameters:
      - description: Custom notification payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/connector-slack_internal_http_dto_request.NotificationPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.NotificationStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.ErrorResponse'
      summary: Send a custom notification to Slack
      tags:
      - notifications
  /notifications/connector-downloader/torrent:
    post:
      consumes:
      - application/json
      description: Accepts a payload from connector-downloader and posts it to Slack
        as a message.
      parameters:
      - description: Notification payload from connector-downloader
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/connector-slack_internal_http_dto_request.TorrentNotificationPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.NotificationStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.ErrorResponse'
      summary: Forward a connector-downloader notification payload to send a Slack
        message
      tags:
      - notifications
  /notifications/grafana/alerts:
    post:
      consumes:
      - application/json
      description: Accepts a Grafana Alerting webhook payload and posts it to Slack
        as a message.
      parameters:
      - description: Webhook payload from Grafana Alerting
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/connector-slack_internal_http_dto_request.GrafanaAlertNotificationPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.NotificationStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/connector-slack_internal_http_dto_response.ErrorResponse'
      summary: Forward a Grafana alert payload to send a Slack message
      tags:
      - notifications
produces:
- application/json
swagger: "2.0"
