basePath: /
definitions:
  connector-slack_internal_http_dto_request.GrafanaAlertNotificationPayload:
    properties:
      alerts:
        items:
          $ref: '#/definitions/notifications.GrafanaAlertItem'
        type: array
      commonAnnotations:
        additionalProperties:
          type: string
        type: object
      commonLabels:
        additionalProperties:
          type: string
        type: object
      externalURL:
        type: string
      groupKey:
        type: string
      groupLabels:
        additionalProperties:
          type: string
        type: object
      orgId:
        type: integer
      receiver:
        type: string
      status:
        type: string
      truncatedAlerts:
        type: integer
      version:
        type: string
    type: object
  connector-slack_internal_http_dto_request.NotificationOptionsPayload:
    properties:
      extra_text:
        type: string
      user:
        type: string
      user_icon:
        type: string
    type: object
  connector-slack_internal_http_dto_request.NotificationPayload:
    properties:
      attachments:
        items:
          additionalProperties: {}
          type: object
        type: array
      blocks:
        items:
          additionalProperties: {}
          type: object
        type: array
      channel_id:
        type: string
      options:
        $ref: '#/definitions/connector-slack_internal_http_dto_request.NotificationOptionsPayload'
    type: object
  connector-slack_internal_http_dto_request.TorrentNotificationPayload:
    properties:
      category:
        type: string
      jellyfin_url:
        type: string
      name:
        type: string
      qbittorrent_url:
        type: string
    type: object
  connector-slack_internal_http_dto_response.ErrorResponse:
    properties:
      error:
        type: string
      upstream_response:
        additionalProperties: {}
        type: object
    type: object
  connector-slack_internal_http_dto_response.HealthResponse:
    properties:
      connector_name:
        type: string
      health_last_check:
        type: string
      health_next_check:
        type: string
      healthy:
        type: boolean
    type: object
  connector-slack_internal_http_dto_response.NotificationStatus:
    properties:
      channel:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  connector-slack_internal_http_dto_response.ReadyResponse:
    properties:
      ready:
        type: boolean
    type: object
  notifications.GrafanaAlertItem:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      dashboardURL:
        type: string
      endsAt:
        type: string
      fingerprint:
        type: string
      generatorURL:
        type: string
      imageURL:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      panelURL:
        type: string
      silenceURL:
        type: string
      startsAt:
        type: string
      status:
        type: string
      values:
        additionalProperties: {}
        type: object
